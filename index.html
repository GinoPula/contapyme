// CALCULOS
function cT(t){
  var s=t.remuneracion,a=AFP[t.afp]||AFP.Prima,mp=t.regLaboral==="mype";
  var es=s*ESSAL,dc=s*(a.ap+a.seg+a.com),nt=s-dc;
  var cts=mp?(s*.5/12):(s+es)/12,vac=mp?(s*.5/12):(s/12);
  var gr=mp?0:(s/6),bo=mp?0:(gr*.09);
  return{s:s,es:es,dc:dc,nt:nt,cts:cts,vac:vac,gr:gr,bo:bo,cost:s+es+cts+vac+gr+bo,mp:mp};
}
function cPlan(){
  return gD("trabajadores").reduce(function(a,t){
    var c=cT(t);
    return{sue:a.sue+c.s,es:a.es+c.es,cts:a.cts+c.cts,vac:a.vac+c.vac,gr:a.gr+c.gr,bo:a.bo+c.bo,cost:a.cost+c.cost,dc:a.dc+c.dc};
  },{sue:0,es:0,cts:0,vac:0,gr:0,bo:0,cost:0,dc:0});
}
function cImp(){
  var vs=gD("ventas"),cs=gD("compras");
  var bV=vs.reduce(function(s,v){return s+v.base},0);
  var iV=vs.reduce(function(s,v){return s+v.igv},0);
  var iC=cs.filter(function(c){return c.credito}).reduce(function(s,c){return s+c.igv},0);
  var iP=Math.max(0,iV-iC);
  var cl=ST.clis.find(function(c){return c.id===ST.cliAct})||{};
  var co=cl.regimen==="RG"?.015:cl.regimen==="RMT"?.01:0;
  return{bV:bV,iV:iV,iC:iC,iP:iP,co:co,pc:bV*co,tot:iP+bV*co};
}
function cDep(a){
  var m=a.valor/a.vida/12,ac=a.acum+m,nt=a.valor-ac;
  return{m:m,an:a.valor/a.vida,ac:ac,nt:nt,mo:Math.max(0,a.vida*12-Math.round(a.acum/m)||0)};
}
function pInc(i){var d=i.dias;return i.monto*(d>=360?.6:d>=181?.2:d>=91?.1:d>=30?.05:0)}

function bAPS(){
  var p=cPlan(),ps=[];
  if(p.sue)ps.push({c:"621",n:"Remuneraciones",D:p.sue,H:0});
  if(p.es)ps.push({c:"627",n:"ESSALUD 9%",D:p.es,H:0});
  if(p.cts)ps.push({c:"625",n:"Provisión CTS",D:p.cts,H:0});
  if(p.vac)ps.push({c:"621",n:"Provisión vacaciones",D:p.vac,H:0});
  if(p.gr)ps.push({c:"621",n:"Provisión gratificaciones",D:p.gr,H:0});
  if(p.bo)ps.push({c:"621",n:"Bonif. ext. 9%",D:p.bo,H:0});
  var nt=p.sue-p.dc;
  if(nt>0)ps.push({c:"411",n:"Remuneraciones x pagar",D:0,H:nt});
  if(p.dc)ps.push({c:"401",n:"AFP/ONP x pagar",D:0,H:p.dc});
  if(p.es)ps.push({c:"401",n:"ESSALUD x pagar",D:0,H:p.es});
  if(p.cts)ps.push({c:"415",n:"CTS x depositar",D:0,H:p.cts});
  if(p.vac)ps.push({c:"415",n:"Vacaciones x pagar",D:0,H:p.vac});
  if(p.gr+p.bo)ps.push({c:"415",n:"Gratis. x pagar",D:0,H:p.gr+p.bo});
  return ps;
}
function bAImp(){
  var i=cImp();
  return i.iP+i.pc>0?[{c:"641",n:"IGV neto",D:i.iP,H:0},{c:"641",n:"IR pago a cta.",D:i.pc,H:0},{c:"4011",n:"IGV x pagar",D:0,H:i.iP},{c:"4017",n:"IR x pagar",D:0,H:i.pc}]:[];
}
function bADep(){
  var t=gD("activos").reduce(function(s,a){return s+cDep(a).m},0);
  return t>0?[{c:"681",n:"Depreciación activos",D:t,H:0},{c:"393",n:"Depreciación acum.",D:0,H:t}]:[];
}
function bAInc(){
  var t=gD("incobrables").reduce(function(s,i){return s+pInc(i)},0);
  return t>0?[{c:"684",n:"Estimación cob. dudosa",D:t,H:0},{c:"191",n:"Prov. cob. dudosa",D:0,H:t}]:[];
}

function rAP(ps,tit){
  if(!ps.length)return"";
  var tD=0,tH=0;
  var rows=ps.map(function(p){tD+=p.D;tH+=p.H;return "<div class='ap-row'><span class='ap-c'>"+p.c+"</span><span class='ap-n'>"+esc(p.n)+"</span><span class='ap-D'>"+(p.D>0?S(p.D):"—")+"</span><span class='ap-H'>"+(p.H>0?S(p.H):"—")+"</span></div>"}).join("");
  var ok=Math.abs(tD-tH)<.01;
  return "<div class='ap-box'><div class='ap-h'>"+esc(tit)+"</div>"+rows+"<div class='ap-tot'><span style='color:"+(ok?"#40916c":"#c0392b")+"'>"+(ok?"✓ Cuadra":"⚠ No cuadra")+"</span><span><span style='color:#40916c'>"+S(tD)+"</span> / <span style='color:#c0392b'>"+S(tH)+"</span></span></div></div>";
}

function rDash(){
  var allD=ST.clis.flatMap(function(c){return(ST._d[c.id]||{}).declaraciones||[]});
  var pend=allD.filter(function(d){return d.estado==="pendiente"}).length;
  var pres=allD.filter(function(d){return d.estado==="presentada"}).length;
  var venc=allD.filter(function(d){return d.estado==="vencida"}).length;
  var urg=allD.filter(function(d){return d.estado!=="presentada"&&dR(d.vencimiento)<=7}).sort(function(a,b){return new Date(a.vencimiento)-new Date(b.vencimiento)});
  var p=cPlan(),imp=cImp();
  var depT=gD("activos").reduce(function(s,a){return s+cDep(a).m},0);
  var provT=p.cost+imp.tot+depT;
  var cl=ST.clis.find(function(c){return c.id===ST.cliAct})||{};

  var urgH=urg.slice(0,5).map(function(d){
    var dias=dR(d.vencimiento);
    var col=dias<=3?"#c0392b":dias<=7?"#d4a843":"var(--ik3)";
    return "<div style='display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--bd)'>"+
      "<div><div style='font-weight:600;font-size:13px'>"+esc(d.tipo)+"</div>"+
      "<div style='font-size:11px;color:var(--ik3)'>"+d.periodo+"</div></div>"+
      "<div style='text-align:right'><div style='font-family:var(--fm);font-size:12px;font-weight:700;color:"+col+"'>"+d.vencimiento+"</div>"+
      "<div style='font-size:11px;font-weight:700;color:"+col+"'>"+(dias<=0?"VENCIDO":dias===1?"Mañana":dias+" días")+"</div></div></div>";
  }).join("");

  var provH=[{ic:"💰",l:"Planilla",v:p.cost,col:"#2d6a4f",m:"planilla"},{ic:"🏛",l:"SUNAT",v:imp.tot,col:"#d4a843",m:"pdt621"},{ic:"📉",l:"Depreciación",v:depT,col:"#5c2d8a",m:"depreciacion"}].map(function(x){
    var pct=provT?fmt(x.v/provT*100):0;
    return "<div style='display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--bd);cursor:pointer' data-mod='"+x.m+"' onclick='gN(this)'>"+
      "<span style='font-size:20px'>"+x.ic+"</span>"+
      "<span style='flex:1;font-weight:600;font-size:13px'>"+x.l+"</span>"+
      "<div style='width:70px;height:5px;background:var(--sl3);border-radius:3px;overflow:hidden'><div style='width:"+pct+"%;height:100%;background:"+x.col+";border-radius:3px'></div></div>"+
      "<span style='font-family:var(--fm);font-weight:700;color:"+x.col+";min-width:88px;text-align:right;font-size:12px'>"+S(x.v)+"</span></div>";
  }).join("");

  var bmap={presentada:"b-green",pendiente:"b-yellow","en-proceso":"b-blue",vencida:"b-red"};
  var dRows=allD.slice(0,5).map(function(d){
    var dias=dR(d.vencimiento);
    return "<tr><td style='font-weight:600'>"+esc(d.tipo)+"</td><td style='font-family:var(--fm);font-size:12px'>"+d.periodo+"</td>"+
      "<td><span class='badge "+(bmap[d.estado]||"b-gray")+"'>"+d.estado+"</span></td>"+
      "<td style='font-size:12px;color:"+(dias<=5&&d.estado!=="presentada"?"#c0392b":"var(--ik3)")+"'>"+d.vencimiento+"</td>"+
      "<td class='r mono'>"+(d.igv?S(d.igv):"—")+"</td><td class='r mono'>"+(d.renta?S(d.renta):"—")+"</td></tr>";
  }).join("");

  return "<div class='ph'><div class='ph-row'><div><h1>Dashboard General</h1>"+
    "<p>"+new Date().toLocaleDateString("es-PE",{weekday:"long",year:"numeric",month:"long",day:"numeric"})+"</p></div></div></div>"+
    "<div class='sg' style='grid-template-columns:repeat(5,1fr)'>"+
      [{l:"CLIENTES",v:ST.clis.length,s:"registrados",c:"#0a1628"},{l:"PENDIENTES",v:pend,s:"declaraciones",c:"#d4a843"},{l:"PRESENTADAS",v:pres,s:"este período",c:"#2d6a4f"},{l:"VENCIDAS",v:venc,s:"urgente",c:"#c0392b"},{l:"PROV.MES",v:S(provT),s:esc(cl.razonSocial||"—"),c:"#0e8a7a"}].map(function(x){
        return "<div class='sc' style='--scc:"+x.c+"'><div class='sl_'>"+x.l+"</div><div class='sv' style='font-size:"+(x.l==="PROV.MES"?"15px":"22px")+";color:"+x.c+"'>"+x.v+"</div><div class='sd'>"+x.s+"</div></div>";
      }).join("")+
    "</div>"+
    "<div class='g2' style='margin-bottom:16px'>"+
      "<div class='card'><div class='card-h'><span class='card-t'>⚠ Vencimientos Urgentes</span>"+
        "<button class='btn bsm bg' data-mod='calendario' onclick='gN(this)'>Ver todos</button></div>"+
        (urg.length?urgH:"<div class='empty'><div class='ei'>✅</div><p>Sin vencimientos urgentes</p></div>")+
      "</div>"+
      "<div class='card'><div class='card-h'><span class='card-t'>Provisiones · "+esc(cl.razonSocial||"—")+"</span></div>"+
        provH+
        "<div style='display:flex;justify-content:flex-end;padding-top:10px;font-weight:800;color:var(--nv);font-family:var(--fh)'>Total: "+S(provT)+"</div>"+
      "</div>"+
    "</div>"+
    "<div class='card'><div class='card-h'><span class='card-t'>Últimas Declaraciones</span>"+
      "<button class='btn bsm bg' data-mod='declaraciones' onclick='gN(this)'>Ver todas</button></div>"+
      "<div class='tw'><table><thead><tr><th>Tipo</th><th>Período</th><th>Estado</th><th>Vencimiento</th><th class='r'>IGV</th><th class='r'>Renta</th></tr></thead>"+
      "<tbody>"+(dRows||"<tr><td colspan='6'><div class='empty'><div class='ei'>📋</div><p>Sin declaraciones</p></div></td></tr>")+"</tbody>"+
      "</table></div></div>";
}

// CLIENTES
var cliQ="";
function rClis(){
  var list=ST.clis.filter(function(c){return c.razonSocial.toLowerCase().indexOf(cliQ.toLowerCase())>=0||c.ruc.indexOf(cliQ)>=0});
  var cards=list.map(function(c){
    var decls=(ST._d[c.id]||{}).declaraciones||[];
    var pend=decls.filter(function(d){return d.estado==="pendiente"}).length;
    var venc=decls.filter(function(d){return d.estado==="vencida"}).length;
    var ac=venc>0?"#c0392b":pend>0?"#d4a843":"#40916c";
    var at=venc>0?"⚠ "+venc+" vencida(s)":pend>0?"⏳ "+pend+" pendiente(s)":"✓ Al día";
    return "<div class='cli-card' style='--cc:"+rCol(c.regimen)+"' data-id='"+c.id+"' onclick='vCli(this.getAttribute(\"data-id\"))'>"+
      "<div style='display:flex;justify-content:space-between;align-items:flex-start'>"+
        "<div><div style='font-family:var(--fh);font-size:14px;font-weight:700;color:var(--nv)'>"+esc(c.razonSocial)+"</div>"+
        "<div style='font-size:11px;color:var(--ik3);font-family:var(--fm)'>RUC: "+esc(c.ruc)+"</div></div>"+
        "<span class='badge b-gray' style='font-size:10px'>"+c.regimen+"</span>"+
      "</div>"+
      "<div style='display:flex;flex-direction:column;gap:4px;margin:11px 0'>"+
        ["👤 "+esc(c.responsable||"—"),"📧 "+esc(c.email||"—"),"📞 "+esc(c.telefono||"—")].map(function(r){return"<div style='display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ik2)'>"+r+"</div>"}).join("")+
      "</div>"+
      "<div style='display:flex;align-items:center;justify-content:space-between;padding-top:11px;border-top:1px solid var(--bd)'>"+
        "<span style='font-size:11px;color:var(--ik3)'>"+decls.length+" declaraciones</span>"+
        "<span style='font-size:11.5px;font-weight:700;color:"+ac+"'>"+at+"</span>"+
      "</div></div>";
  }).join("");
  return "<div class='ph'><div class='ph-row'><div><h1>Clientes</h1><p>"+ST.clis.length+" clientes registrados</p></div>"+
    "<button class='btn bp' onclick='oCli()'>+ Nuevo Cliente</button></div></div>"+
    "<div class='toolbar'>"+
      "<div class='sw'><span class='sic'>⌕</span><input class='si_' placeholder='Buscar nombre o RUC...' value='"+esc(cliQ)+"' oninput='cliQ=this.value;rMod(\"clientes\")'/></div>"+
      ["RG","RMT","RS","RUS"].map(function(r){return"<button class='btn bsm bg' onclick='cliQ=\""+r+"\";rMod(\"clientes\")'>"+r+"</button>"}).join("")+
      "<button class='btn bsm bg' onclick='cliQ=\"\";rMod(\"clientes\")'>Todos</button>"+
    "</div>"+
    (list.length?"<div class='cli-grid'>"+cards+"</div>":"<div class='empty'><div class='ei'>👥</div><p>Sin clientes</p></div>");
}
function vCli(id){ST.cliAct=id;var s=$("cli-sel");if(s)s.value=id;navTo("declaraciones")}
function oCli(d){
  d=d||{razonSocial:"",ruc:"",regimen:"RG",responsable:"",email:"",telefono:"",direccion:"",notas:""};
  var e=!!d.id;
  $("modal-root").innerHTML="<div class='ov' onclick='if(event.target===this)cm()'>"+
  "<div class='modal modal-lg'><div class='mh'><span class='mt_'>"+(e?"Editar":"Nuevo")+" Cliente</span><button class='btn bsm bg' onclick='cm()'>✕</button></div>"+
  "<div class='fg3'>"+
    "<div class='fg span2'><label class='fl'>Razón Social *</label><input class='fi' id='cr-rs' value='"+esc(d.razonSocial)+"'/></div>"+
    "<div class='fg'><label class='fl'>RUC *</label><input class='fi' id='cr-ruc' value='"+esc(d.ruc)+"' maxlength='11'/></div>"+
    "<div class='fg'><label class='fl'>Régimen</label><select class='fsel' id='cr-reg'>"+["RG","RMT","RS","RUS"].map(function(r){return"<option value='"+r+"'"+(d.regimen===r?" selected":"")+">"+r+" — "+rLbl(r)+"</option>"}).join("")+"</select></div>"+
    "<div class='fg'><label class='fl'>Responsable</label><input class='fi' id='cr-resp' value='"+esc(d.responsable)+"'/></div>"+
    "<div class='fg'><label class='fl'>Email</label><input class='fi' id='cr-em' type='email' value='"+esc(d.email)+"'/></div>"+
    "<div class='fg'><label class='fl'>Teléfono</label><input class='fi' id='cr-tel' value='"+esc(d.telefono)+"'/></div>"+
    "<div class='fg span3'><label class='fl'>Dirección</label><input class='fi' id='cr-dir' value='"+esc(d.direccion||"")+"'/></div>"+
    "<div class='fg span3'><label class='fl'>Notas</label><textarea class='fta' id='cr-not'>"+esc(d.notas||"")+"</textarea></div>"+
  "</div>"+
  "<div class='mf'><button class='btn bg' onclick='cm()'>Cancelar</button><button class='btn bp' onclick='sCli(\""+(e?d.id:"")+"\")'>"+(e?"Guardar":"Registrar")+"</button></div>"+
  "</div></div>";
}
async function sCli(editId){
  var rs=($("cr-rs")||{}).value,ruc=($("cr-ruc")||{}).value;
  if(!rs||!ruc){notify("Razón social y RUC requeridos","err");return}
  var obj={razonSocial:rs,ruc:ruc,regimen:$("cr-reg").value,responsable:$("cr-resp").value,email:$("cr-em").value,telefono:$("cr-tel").value,direccion:$("cr-dir").value,notas:$("cr-not").value,activo:true};
  if(editId){await fbU("clientes",editId,obj);var idx=ST.clis.findIndex(function(c){return c.id===editId});if(idx>=0)ST.clis[idx]=Object.assign({},ST.clis[idx],obj);notify("Actualizado ✓")}
  else{var id=await fbS("clientes",obj)||("c_"+Date.now());ST.clis.unshift(Object.assign({id:id},obj));if(!ST._d[id])ST._d[id]={trabajadores:[],ventas:[],compras:[],activos:[],incobrables:[],asientos:[],declaraciones:[]};notify("Cliente registrado ✓")}
  cm();rApp();
}

// DECLARACIONES
var dQ="",dEst="todos";
function rDecls(){
  var cl=ST.clis.find(function(c){return c.id===ST.cliAct})||{};
  var arr=gD("declaraciones");
  var list=arr.filter(function(d){
    return(d.tipo.toLowerCase().indexOf(dQ.toLowerCase())>=0||d.periodo.indexOf(dQ)>=0)&&(dEst==="todos"||d.estado===dEst)
  });
  var bmap={presentada:"b-green",pendiente:"b-yellow","en-proceso":"b-blue",vencida:"b-red"};
  return "<div class='ph'><div class='ph-row'><div><h1>Declaraciones SUNAT</h1><p>"+esc(cl.razonSocial||"—")+" · RUC: "+esc(cl.ruc||"—")+"</p></div>"+
    "<button class='btn bp' onclick='oDecl(null)'>+ Nueva Declaración</button></div></div>"+
    "<div class='sg' style='grid-template-columns:repeat(4,1fr)'>"+
      [["Pendientes","pendiente","#d4a843"],["En proceso","en-proceso","#0e8a7a"],["Presentadas","presentada","#2d6a4f"],["Vencidas","vencida","#c0392b"]].map(function(x){
        return "<div class='sc' style='--scc:"+x[2]+";cursor:pointer' data-est='"+x[1]+"' onclick='dEst=this.getAttribute(\"data-est\");rMod(\"declaraciones\")'><div class='sl_'>"+x[0].toUpperCase()+"</div><div class='sv' style='color:"+x[2]+"'>"+arr.filter(function(d){return d.estado===x[1]}).length+"</div></div>";
      }).join("")+
    "</div>"+
    "<div class='card'><div class='toolbar'>"+
      "<div class='sw'><span class='sic'>⌕</span><input class='si_' placeholder='Buscar...' value='"+esc(dQ)+"' oninput='dQ=this.value;rMod(\"declaraciones\")'/></div>"+
      ["todos","pendiente","en-proceso","presentada","vencida"].map(function(e){return"<button class='btn bsm "+(dEst===e?"bp":"bg")+"' data-est='"+e+"' onclick='dEst=this.getAttribute(\"data-est\");rMod(\"declaraciones\")'>"+(e==="todos"?"Todos":e)+"</button>"}).join("")+
    "</div>"+
    "<div class='tw'><table><thead><tr><th>Tipo / Período</th><th>Estado</th><th>Vencimiento</th><th class='r'>IGV</th><th class='r'>Renta</th><th>Notas</th><th></th></tr></thead>"+
    "<tbody>"+list.map(function(d){
      var dias=dR(d.vencimiento);
      return "<tr><td><div style='font-weight:700'>"+esc(d.tipo)+"</div><div style='font-size:11px;font-family:var(--fm);color:var(--ik3)'>"+d.periodo+"</div></td>"+
        "<td><span class='badge "+(bmap[d.estado]||"b-gray")+"'>"+d.estado+"</span></td>"+
        "<td style='font-size:12px;color:"+(dias<=5&&d.estado!=="presentada"?"#c0392b":"var(--ik3)")+"'>"+d.vencimiento+"</td>"+
        "<td class='r mono'>"+(d.igv?S(d.igv):"—")+"</td><td class='r mono'>"+(d.renta?S(d.renta):"—")+"</td>"+
        "<td style='font-size:12px;color:var(--ik3)'>"+esc(d.notas||"—")+"</td>"+
        "<td><div style='display:flex;gap:5px'><button class='btn bsm bg' data-id='"+d.id+"' onclick='oDecl(this.getAttribute(\"data-id\"))'>✎</button>"+
        "<button class='btn bsm br' data-id='"+d.id+"' onclick='delD(this.getAttribute(\"data-id\"))'>✕</button></div></td></tr>";
    }).join("")||"<tr><td colspan='7'><div class='empty'><div class='ei'>📋</div><p>Sin declaraciones</p></div></td></tr>"+
    "</tbody></table></div></div>";
}
function oDecl(id){
  var d=id?gD("declaraciones").find(function(x){return x.id===id}):null;
  var def=d||{tipo:"PDT 621",periodo:ST.per,vencimiento:"",estado:"pendiente",igv:"",renta:"",notas:""};
  var TIPOS=["PDT 621","PDT 601","PDT 617","Renta Anual","Cuota RUS","DAOT","Libros Electrónicos","Otros"];
  $("modal-root").innerHTML="<div class='ov' onclick='if(event.target===this)cm()'>"+
  "<div class='modal'><div class='mh'><span class='mt_'>"+(d?"Editar":"Nueva")+" Declaración</span><button class='btn bsm bg' onclick='cm()'>✕</button></div>"+
  "<div class='fg2'>"+
    "<div class='fg'><label class='fl'>Tipo *</label><select class='fsel' id='dl-t'>"+TIPOS.map(function(t){return"<option"+(def.tipo===t?" selected":"")+">"+t+"</option>"}).join("")+"</select></div>"+
    "<div class='fg'><label class='fl'>Período</label><input class='fi' id='dl-p' type='month' value='"+def.periodo+"'/></div>"+
    "<div class='fg'><label class='fl'>Vencimiento</label><input class='fi' id='dl-v' type='date' value='"+(def.vencimiento||"")+"'/></div>"+
    "<div class='fg'><label class='fl'>Estado</label><select class='fsel' id='dl-e'>"+["pendiente","en-proceso","presentada","vencida"].map(function(e){return"<option"+(def.estado===e?" selected":"")+">"+e+"</option>"}).join("")+"</select></div>"+
    "<div class='fg'><label class='fl'>IGV (S/)</label><input class='fi' id='dl-ig' type='number' value='"+(def.igv||"")+"'/></div>"+
    "<div class='fg'><label class='fl'>Renta (S/)</label><input class='fi' id='dl-re' type='number' value='"+(def.renta||"")+"'/></div>"+
    "<div class='fg span2'><label class='fl'>Notas</label><textarea class='fta' id='dl-no'>"+esc(def.notas||"")+"</textarea></div>"+
  "</div>"+
  "<div class='mf'><button class='btn bg' onclick='cm()'>Cancelar</button><button class='btn bp' onclick='sDecl(\""+(d?d.id:"")+"\")'>"+(d?"Guardar":"Registrar")+"</button></div>"+
  "</div></div>";
}
async function sDecl(eid){
  var obj={tipo:$("dl-t").value,periodo:$("dl-p").value,vencimiento:$("dl-v").value,estado:$("dl-e").value,igv:parseFloat($("dl-ig").value)||0,renta:parseFloat($("dl-re").value)||0,notas:$("dl-no").value};
  var arr=gD("declaraciones");
  if(eid){var i=arr.findIndex(function(x){return x.id===eid});if(i>=0)arr[i]=Object.assign({},arr[i],obj);notify("Actualizado ✓")}
  else{arr.unshift(Object.assign({id:"D"+Date.now()},obj));notify("Declaración registrada ✓")}
  cm();rMod("declaraciones");rApp();
}
function delD(id){if(!confirm("¿Eliminar?"))return;sD("declaraciones",gD("declaraciones").filter(function(x){return x.id!==id}));notify("Eliminado");rMod("declaraciones")}

// CALENDARIO
function rCal(){
  var all=ST.clis.flatMap(function(c){return((ST._d[c.id]||{}).declaraciones||[]).map(function(d){return Object.assign({},d,{_cid:c.id})})}).filter(function(d){return d.estado!=="presentada"}).sort(function(a,b){return new Date(a.vencimiento)-new Date(b.vencimiento)});
  var urg=all.filter(function(d){return dR(d.vencimiento)>=0&&dR(d.vencimiento)<=7}).length;
  var venc=all.filter(function(d){return d.estado==="vencida"}).length;
  var bmap={pendiente:"b-yellow","en-proceso":"b-blue",vencida:"b-red"};
  return "<div class='ph'><h1>📅 Calendario Tributario</h1><p>Todos los clientes · Por urgencia</p></div>"+
    "<div class='sg' style='grid-template-columns:repeat(4,1fr)'>"+
      [{l:"VENCIDAS",v:venc,c:"#c0392b"},{l:"PRÓX. 7 DÍAS",v:urg,c:"#d4a843"},{l:"TOTAL PEND.",v:all.length,c:"#0a1628"},{l:"CLIENTES",v:ST.clis.length,c:"#2d6a4f"}].map(function(x){return"<div class='sc' style='--scc:"+x.c+"'><div class='sl_'>"+x.l+"</div><div class='sv' style='color:"+x.c+"'>"+x.v+"</div></div>"}).join("")+
    "</div>"+
    (all.length?
    "<div style='display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:13px'>"+
    all.map(function(d){
      var c=ST.clis.find(function(x){return x.id===d._cid})||{razonSocial:"?"};
      var dias=dR(d.vencimiento);
      var col=d.estado==="vencida"?"#c0392b":dias<=5?"#c0392b":dias<=15?"#d4a843":"#40916c";
      return "<div style='background:white;border:1.5px solid "+(dias<=5?"#ffd0d0":"var(--bd)")+";border-radius:var(--r);padding:16px'>"+
        "<div style='display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px'>"+
          "<div><div style='font-weight:700;font-size:13px'>"+esc(d.tipo)+"</div>"+
          "<div style='font-size:12px;color:var(--ik2);cursor:pointer' data-id='"+d._cid+"' onclick='vCli(this.getAttribute(\"data-id\"))'>"+esc(c.razonSocial)+"</div>"+
          "<div style='font-size:11px;font-family:var(--fm);color:var(--ik3)'>"+d.periodo+"</div></div>"+
          "<div style='text-align:right'><div style='font-family:var(--fm);font-size:12px;font-weight:700;color:"+col+"'>"+d.vencimiento+"</div>"+
          "<div style='font-size:11px;font-weight:700;color:"+col+"'>"+(d.estado==="vencida"?"VENCIDA":dias<=0?"HOY":dias===1?"Mañana":dias+" días")+"</div></div>"+
        "</div>"+
        "<div style='display:flex;justify-content:space-between;align-items:center'>"+
          "<span class='badge "+(bmap[d.estado]||"b-gray")+"'>"+d.estado+"</span>"+
          "<button class='btn bsm bg' data-id='"+d.id+"' onclick='oDecl(this.getAttribute(\"data-id\"))'>Actualizar</button>"+
        "</div></div>";
    }).join("")+"</div>":
    "<div class='empty'><div class='ei'>🎉</div><p>¡Todo al día!</p></div>");
}

// LIBRO DIARIO
var asPs=[{c:"",n:"",D:0,H:0},{c:"",n:"",D:0,H:0}];
var PCGE=[["101","Caja"],["104","Ctas. corrientes"],["121","Fact. x cobrar"],["191","Prov. cob. dudosa"],["393","Dep. acumulada"],["401","Tributos x pagar"],["4011","IGV cta. propia"],["4017","IR x pagar"],["411","Remun. x pagar"],["415","Beneficios sociales"],["421","Fact. x pagar"],["501","Capital social"],["591","Resultados acum."],["621","Remuneraciones"],["625","CTS"],["627","ESSALUD"],["632","Asesoría"],["636","Servicios básicos"],["641","Gtos. tributarios"],["681","Depreciación"],["684","Estimación incob."],["701","Ventas mercad."],["704","Ventas servicios"],["94","Gtos. admin."],["95","Gtos. ventas"]];

function rDiario(){
  var cl=ST.clis.find(function(c){return c.id===ST.cliAct})||{};
  var arr=gD("asientos");
  var tD=arr.reduce(function(s,a){return s+a.partidas.reduce(function(x,p){return x+p.D},0)},0);
  var tH=arr.reduce(function(s,a){return s+a.partidas.reduce(function(x,p){return x+p.H},0)},0);
  var ok=Math.abs(tD-tH)<.01;
  return "<div class='ph'><div class='ph-row'><div><h1>📔 Libro Diario</h1><p>"+esc(cl.razonSocial||"—")+" · "+ST.per+"</p></div>"+
    "<div style='display:flex;gap:9px'><button class='btn bp' onclick='oAs()'>+ Nuevo Asiento</button>"+
    "<button class='btn bgo' onclick='genAsAuto()'>⚡ Auto Facturas</button></div></div></div>"+
    "<div class='sg' style='grid-template-columns:repeat(4,1fr)'>"+
      [{l:"ASIENTOS",v:arr.length,c:"#0a1628"},{l:"TOTAL DEBE",v:S(tD),c:"#2d6a4f"},{l:"TOTAL HABER",v:S(tH),c:"#c0392b"},{l:"PARTIDA",v:ok?"✓ CUADRA":"✕ ERROR",c:ok?"#2d6a4f":"#c0392b"}].map(function(x){return"<div class='sc' style='--scc:"+x.c+"'><div class='sl_'>"+x.l+"</div><div class='sv' style='font-size:16px;color:"+x.c+"'>"+x.v+"</div></div>"}).join("")+
    "</div>"+
    (arr.length?arr.map(function(a){
      var aD=a.partidas.reduce(function(s,p){return s+p.D},0);
      return "<div class='as-card'><div class='as-hdr' data-id='"+a.id+"' onclick='tAs(this.getAttribute(\"data-id\"))'>"+
        "<span class='as-num'>"+a.numero+"</span>"+
        "<span class='as-gl'>"+esc(a.glosa)+"</span>"+
        "<span class='as-fe'>"+a.fecha+"</span>"+
        "<span style='font-family:var(--fm);font-size:12px;color:#40916c;margin-left:8px;font-weight:700'>"+S(aD)+"</span>"+
        "<span style='margin-left:8px;color:var(--ik3)' id='ic-"+a.id+"'>▼</span>"+
        "<div style='display:flex;gap:5px;margin-left:8px'>"+
          "<button class='btn bsm bg' data-id='"+a.id+"' onclick='event.stopPropagation();oAs(gD(\"asientos\").find(function(x){return x.id===this.getAttribute(\"data-id\")}.bind(this)))'>✎</button>"+
          "<button class='btn bsm br' data-id='"+a.id+"' onclick='event.stopPropagation();delAs(this.getAttribute(\"data-id\"))'>✕</button>"+
        "</div></div>"+
        "<div class='as-body' id='ab-"+a.id+"'>"+
          "<table class='as-tbl'><thead><tr><th>Cuenta</th><th>Descripción</th><th class='r'>DEBE</th><th class='r'>HABER</th></tr></thead>"+
          "<tbody>"+a.partidas.map(function(p){return"<tr><td style='font-family:var(--fm);font-size:11px;font-weight:700;color:var(--nv)'>"+p.c+"</td><td>"+esc(p.n)+"</td><td class='r' style='color:#40916c;font-family:var(--fm)'>"+(p.D>0?S(p.D):"—")+"</td><td class='r' style='color:#c0392b;font-family:var(--fm)'>"+(p.H>0?S(p.H):"—")+"</td></tr>"}).join("")+"</tbody>"+
          "<tfoot><tr><td colspan='2' style='text-align:right'>TOTALES</td><td class='r' style='font-family:var(--fm);color:#40916c'>"+S(aD)+"</td><td class='r' style='font-family:var(--fm);color:#c0392b'>"+S(aD)+"</td></tr></tfoot></table>"+
        "</div></div>";
    }).join(""):"<div class='empty'><div class='ei'>📔</div><p>Sin asientos. Usa + Nuevo o ⚡ Auto.</p></div>");
}
function tAs(id){var b=$("ab-"+id),ic=$("ic-"+id);if(!b)return;var o=b.classList.toggle("open");if(ic)ic.textContent=o?"▲":"▼"}
function delAs(id){if(!confirm("¿Eliminar asiento?"))return;sD("asientos",gD("asientos").filter(function(a){return a.id!==id}));notify("Eliminado");rMod("diario")}
function genAsAuto(){
  var arr=gD("asientos"),i=0;
  gD("ventas").forEach(function(v){arr.push({id:"AV"+Date.now()+(i++),fecha:v.fecha,numero:String(arr.length+1).padStart(3,"0"),glosa:"VENTA "+v.serie+"-"+v.numero+" - "+v.cliente,partidas:[{c:"121",n:"Fact. x cobrar",D:v.total,H:0},{c:"704",n:"Ventas servicios",D:0,H:v.base},{c:"4011",n:"IGV x pagar",D:0,H:v.igv}]})});
  gD("compras").forEach(function(c){arr.push({id:"AC"+Date.now()+(i++),fecha:c.fecha,numero:String(arr.length+1).padStart(3,"0"),glosa:"COMPRA "+c.serie+"-"+c.numero+" - "+c.proveedor,partidas:[{c:"636",n:"Servicios/Gastos",D:c.base,H:0},{c:"4011",n:"IGV crédito",D:c.igv,H:0},{c:"421",n:"Fact. x pagar",D:0,H:c.total}]})});
  notify("Asientos generados ✓");rMod("diario");
}
function oAs(data){
  asPs=data?JSON.parse(JSON.stringify(data.partidas)):[{c:"",n:"",D:0,H:0},{c:"",n:"",D:0,H:0}];
  var d=data||{fecha:hoy(),numero:"",glosa:""};
  var opts=PCGE.map(function(x){return"<option value='"+x[0]+"'>"+x[0]+" — "+x[1]+"</option>"}).join("");
  $("modal-root").innerHTML="<div class='ov' onclick='if(event.target===this)cm()'>"+
  "<div class='modal modal-xl'><div class='mh'><span class='mt_'>"+(data?"Editar":"Nuevo")+" Asiento</span><button class='btn bsm bg' onclick='cm()'>✕</button></div>"+
  "<div class='fg3' style='margin-bottom:14px'>"+
    "<div class='fg'><label class='fl'>N° Asiento</label><input class='fi' id='as-n' value='"+esc(d.numero)+"' placeholder='001'/></div>"+
    "<div class='fg'><label class='fl'>Fecha</label><input class='fi' id='as-f' type='date' value='"+d.fecha+"'/></div>"+
    "<div class='fg span3'><label class='fl'>Glosa *</label><input class='fi' id='as-g' value='"+esc(d.glosa)+"' placeholder='Descripción...'/></div>"+
  "</div>"+
  "<table class='as-tbl' style='margin-bottom:10px'><thead><tr><th style='width:200px'>Cuenta</th><th>Descripción</th><th class='r' style='width:120px'>DEBE</th><th class='r' style='width:120px'>HABER</th><th style='width:40px'></th></tr></thead>"+
  "<tbody id='as-tb'></tbody>"+
  "<tfoot><tr><td colspan='2' style='text-align:right'>TOTALES</td><td class='r' id='as-tD' style='font-family:var(--fm);color:#40916c'>S/ 0.00</td><td class='r' id='as-tH' style='font-family:var(--fm);color:#c0392b'>S/ 0.00</td><td></td></tr></tfoot></table>"+
  "<button class='btn bsm bg' onclick='asAdd()'>+ Línea</button>"+
  "<div id='as-err' style='display:none;color:#c0392b;font-size:12px;font-weight:700;margin-top:8px'>⚠ El asiento no cuadra</div>"+
  "<div class='mf'><button class='btn bg' onclick='cm()'>Cancelar</button><button class='btn bp' onclick='sAs(\""+(data?data.id:"")+"\")'>"+(data?"Guardar":"Registrar")+"</button></div>"+
  "</div></div>";
  asRdr(opts);
}
function asRdr(opts){
  var co=opts||PCGE.map(function(x){return"<option value='"+x[0]+"'>"+x[0]+" — "+x[1]+"</option>"}).join("");
  var tb=$("as-tb");if(!tb)return;
  tb.innerHTML=asPs.map(function(p,i){
    return "<tr><td><select class='fsel' style='font-size:12px;padding:5px 8px' data-i='"+i+"' onchange='asUp(parseInt(this.getAttribute(\"data-i\")),\"c\",this.value)'><option value=''>-- Cuenta --</option>"+co.replace("value='"+p.c+"'","value='"+p.c+"' selected")+"</select></td>"+
      "<td style='font-size:12px;color:var(--ik3)'>"+(PCGE.find(function(x){return x[0]===p.c})||["",""])[1]+"</td>"+
      "<td><input type='number' class='fi' style='text-align:right;padding:5px 8px;font-size:12px' value='"+(p.D||"")+"' data-i='"+i+"' oninput='asUp(parseInt(this.getAttribute(\"data-i\")),\"D\",this.value)'/></td>"+
      "<td><input type='number' class='fi' style='text-align:right;padding:5px 8px;font-size:12px' value='"+(p.H||"")+"' data-i='"+i+"' oninput='asUp(parseInt(this.getAttribute(\"data-i\")),\"H\",this.value)'/></td>"+
      "<td><button class='btn bsm br' style='padding:4px 7px' data-i='"+i+"' onclick='asRm(parseInt(this.getAttribute(\"data-i\")))'>✕</button></td></tr>";
  }).join("");
  asT();
}
function asUp(i,f,v){asPs[i][f]=f==="c"?v:parseFloat(v)||0;if(f==="c")asRdr();else asT()}
function asAdd(){asPs.push({c:"",n:"",D:0,H:0});asRdr()}
function asRm(i){asPs.splice(i,1);asRdr()}
function asT(){
  var D=asPs.reduce(function(s,p){return s+p.D},0),H=asPs.reduce(function(s,p){return s+p.H},0);
  var tD=$("as-tD"),tH=$("as-tH"),err=$("as-err");
  if(tD)tD.textContent=S(D);if(tH)tH.textContent=S(H);
  if(err)err.style.display=Math.abs(D-H)<.01||D===0?"none":"block";
}
function sAs(eid){
  var g=($("as-g")||{}).value,f=($("as-f")||{}).value;
  if(!g||!f){notify("Completa fecha y glosa","err");return}
  var D=asPs.reduce(function(s,p){return s+p.D},0),H=asPs.reduce(function(s,p){return s+p.H},0);
  if(Math.abs(D-H)>.01){notify("El asiento no cuadra","err");return}
  var obj={fecha:f,numero:$("as-n").value,glosa:g,partidas:asPs.map(function(p){return Object.assign({},p,{n:(PCGE.find(function(x){return x[0]===p.c})||["",p.n])[1]})})};
  var arr=gD("asientos");
  if(eid){var i=arr.findIndex(function(a){return a.id===eid});if(i>=0)arr[i]=Object.assign({},arr[i],obj);notify("Actualizado ✓")}
  else{arr.unshift(Object.assign({id:"A"+Date.now()},obj));notify("Asiento registrado ✓")}
  cm();rMod("diario");
}

// MAYOR
function rMayor(){
  var cl=ST.clis.find(function(c){return c.id===ST.cliAct})||{};
  var ctas={};
  gD("asientos").forEach(function(a){a.partidas.forEach(function(p){if(!p.c)return;if(!ctas[p.c])ctas[p.c]={D:0,H:0,movs:[]};ctas[p.c].D+=p.D;ctas[p.c].H+=p.H;ctas[p.c].movs.push({fecha:a.fecha,glosa:a.glosa,D:p.D,H:p.H})})});
  var keys=Object.keys(ctas);
  return "<div class='ph'><h1>📒 Libro Mayor</h1><p>"+esc(cl.razonSocial||"—")+" · "+ST.per+" · "+keys.length+" cuentas</p></div>"+
  (keys.length?keys.sort().map(function(cta){
    var d=ctas[cta],nom=(PCGE.find(function(x){return x[0]===cta})||[cta,cta])[1],sal=d.D-d.H;
    var sa=0;
    return "<div class='card' style='margin-bottom:12px'>"+
      "<div style='background:linear-gradient(135deg,#0a1628,#162952);color:white;margin:-20px -20px 14px;padding:13px 20px;display:flex;align-items:center;gap:12px;border-radius:var(--r) var(--r) 0 0'>"+
        "<span style='font-family:var(--fm);font-size:13px;font-weight:700'>"+cta+"</span>"+
        "<span style='flex:1;font-weight:600'>"+nom+"</span>"+
        "<span style='font-family:var(--fm);font-size:13px'>"+(sal>=0?S(sal)+" DEUDOR":S(Math.abs(sal))+" ACREEDOR")+"</span>"+
      "</div>"+
      "<div class='tw'><table><thead><tr><th>Fecha</th><th>Concepto</th><th class='r' style='color:#40916c'>DEBE</th><th class='r' style='color:#c0392b'>HABER</th><th class='r'>SALDO</th></tr></thead>"+
      "<tbody>"+d.movs.map(function(m){sa+=m.D-m.H;return"<tr><td style='font-size:11px'>"+m.fecha+"</td><td style='font-size:12px'>"+esc(m.glosa)+"</td><td class='r mono' style='color:#40916c'>"+(m.D>0?S(m.D):"—")+"</td><td class='r mono' style='color:#c0392b'>"+(m.H>0?S(m.H):"—")+"</td><td class='r mono' style='font-weight:600;color:"+(sa>=0?"#40916c":"#c0392b")+"'>"+S(Math.abs(sa))+"</td></tr>"}).join("")+"</tbody>"+
      "<tfoot><tr><td colspan='2' style='text-align:right'>TOTALES</td><td class='r mono' style='color:#40916c'>"+S(d.D)+"</td><td class='r mono' style='color:#c0392b'>"+S(d.H)+"</td><td class='r mono'>"+S(Math.abs(sal))+"</td></tr></tfoot></table></div></div>";
  }).join(""):"<div class='empty'><div class='ei'>📒</div><p>Sin movimientos</p></div>");
}

// BALANCE
function rBal(){
  var cl=ST.clis.find(function(c){return c.id===ST.cliAct})||{};
  var ctas={};
  gD("asientos").forEach(function(a){a.partidas.forEach(function(p){if(!p.c)return;if(!ctas[p.c])ctas[p.c]={D:0,H:0};ctas[p.c].D+=p.D;ctas[p.c].H+=p.H})});
  var tD=0,tH=0,tSD=0,tSH=0;
  var rows=Object.entries(ctas).sort(function(a,b){return a[0].localeCompare(b[0])}).map(function(e){
    var c=e[0],d=e[1],s=d.D-d.H,sD=s>=0?s:0,sH=s<0?Math.abs(s):0;
    tD+=d.D;tH+=d.H;tSD+=sD;tSH+=sH;
    return "<tr><td style='font-family:var(--fm);font-size:11px;font-weight:700;color:var(--nv)'>"+c+"</td>"+
      "<td>"+((PCGE.find(function(x){return x[0]===c})||[c,c])[1])+"</td>"+
      "<td class='r mono' style='color:#40916c'>"+S(d.D)+"</td><td class='r mono' style='color:#c0392b'>"+S(d.H)+"</td>"+
      "<td class='r mono' style='color:#40916c'>"+(sD>0?S(sD):"—")+"</td><td class='r mono' style='color:#c0392b'>"+(sH>0?S(sH):"—")+"</td></tr>";
  }).join("");
  var ok=Math.abs(tD-tH)<.01;
  return "<div class='ph'><div class='ph-row'><div><h1>⚖ Balance de Comprobación</h1><p>"+esc(cl.razonSocial||"—")+" · "+ST.per+"</p></div>"+
    "<span class='badge "+(ok?"b-green":"b-red")+"' style='font-size:13px;padding:6px 16px'>"+(ok?"✓ CUADRA":"✕ NO CUADRA")+"</span></div></div>"+
    "<div class='card'><div class='tw'><table><thead><tr><th>Cuenta</th><th>Nombre</th><th class='r' style='color:#40916c'>DEBE</th><th class='r' style='color:#c0392b'>HABER</th><th class='r' style='color:#40916c'>S. DEUDOR</th><th class='r' style='color:#c0392b'>S. ACREEDOR</th></tr></thead>"+
    "<tbody>"+(rows||"<tr><td colspan='6'><div class='empty'><div class='ei'>⚖</div><p>Sin movimientos</p></div></td></tr>")+"</tbody>"+
    "<tfoot><tr style='background:#0a1628;color:white'><td colspan='2' style='padding:11px 13px;text-align:right;font-weight:800'>TOTALES</td>"+
      "<td class='r mono' style='padding:11px 13px'>"+S(tD)+"</td><td class='r mono' style='padding:11px 13px'>"+S(tH)+"</td>"+
      "<td class='r mono' style='padding:11px 13px'>"+S(tSD)+"</td><td class='r mono' style='padding:11px 13px'>"+S(tSH)+"</td></tr></tfoot>"+
    "</table></div></div>";
}

// VENTAS
function rVtas(){
  var vs=gD("ventas");
  var tB=vs.reduce(function(s,v){return s+v.base},0),tI=vs.reduce(function(s,v){return s+v.igv},0),tT=vs.reduce(function(s,v){return s+v.total},0);

    "</div>"+
    "<div class='card'><div class='tw'><table><thead><tr><th>Fecha</th><th>Serie-Nro.</th><th>RUC</th><th>Cliente</th><th class='r'>Base</th><th class='r'>IGV</th><th class='r'>Total</th><th></th></tr></thead>"+
    "<tbody>"+vs.map(function(v){return"<tr><td style='font-family:var(--fm);font-size:11px'>"+v.fecha+"</td><td style='font-family:var(--fm);font-size:11px'>"+v.serie+"-"+v.numero+"</td><td style='font-family:var(--fm);font-size:11px'>"+v.rucCli+"</td><td style='font-weight:500'>"+esc(v.cliente)+"</td><td class='r mono' style='color:#40916c'>"+S(v.base)+"</td><td class='r mono' style='color:#c0392b'>"+S(v.igv)+"</td><td class='r mono' style='font-weight:700'>"+S(v.total)+"</td><td><button class='btn bsm br' data-id='"+v.id+"' onclick='delV(this.getAttribute(\"data-id\"))'>✕</button></td></tr>"}).join("")||"<tr><td colspan='8'><div class='empty'><div class='ei'>📈</div><p>Sin ventas</p></div></td></tr>"+

function oVta(){$("modal-root").innerHTML="<div class='ov' onclick='if(event.target===this)cm()'><div class='modal modal-lg'><div class='mh'><span class='mt_'>Nueva Venta</span><button class='btn bsm bg' onclick='cm()'>✕</button></div><div class='fg2'><div class='fg'><label class='fl'>Fecha</label><input class='fi' id='v-f' type='date' value='"+hoy()+"'/></div><div class='fg'><label class='fl'>Tipo</label><select class='fsel' id='v-t'><option value='01'>Factura</option><option value='03'>Boleta</option></select></div><div class='fg'><label class='fl'>Serie</label><input class='fi' id='v-s' value='F001'/></div><div class='fg'><label class='fl'>Número</label><input class='fi' id='v-n' placeholder='0001'/></div><div class='fg'><label class='fl'>RUC Cliente</label><input class='fi' id='v-r' placeholder='20123456789'/></div><div class='fg'><label class='fl'>Cliente</label><input class='fi' id='v-c' placeholder='Empresa SAC'/></div><div class='fg'><label class='fl'>Base Imponible (S/)</label><input class='fi' id='v-b' type='number' placeholder='0.00' oninput='var b=parseFloat(this.value)||0;$(&quot;v-i&quot;).value=fmt(b*.18);$(&quot;v-tt&quot;).value=fmt(b*1.18)'/></div><div class='fg'><label class='fl'>IGV 18% (auto)</label><input class='fi' id='v-i' readonly/></div><div class='fg span2'><label class='fl'>Total (auto)</label><input class='fi' id='v-tt' readonly/></div></div><div class='mf'><button class='btn bg' onclick='cm()'>Cancelar</button><button class='btn bp' onclick='sVta()'>Registrar</button></div></div></div>"}
function sVta(){var b=parseFloat(($("v-b")||{}).value)||0;if(!b){notify("Ingresa la base","err");return}gD("ventas").unshift({id:"V"+Date.now(),fecha:$("v-f").value,serie:$("v-s").value,numero:$("v-n").value,rucCli:$("v-r").value,cliente:$("v-c").value,base:b,igv:b*.18,total:b*1.18});notify("Venta registrada ✓");cm();rMod("ventas")}
function delV(id){if(!confirm("¿Eliminar?"))return;sD("ventas",gD("ventas").filter(function(v){return v.id!==id}));notify("Eliminado");rMod("ventas")}

// COMPRAS
function rCompras(){
  var cs=gD("compras");
  var tB=cs.reduce(function(s,c){return s+c.base},0),tI=cs.reduce(function(s,c){return s+c.igv},0),tC=cs.filter(function(c){return c.credito}).reduce(function(s,c){return s+c.igv},0);
  return "<div class='ph'><div class='ph-row'><div><h1>📉 Registro de Compras</h1><p>"+ST.per+"</p></div>"+

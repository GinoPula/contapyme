<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#0a1628;--navy2:#0f2040;--navy3:#162952;
  --gold:#d4a843;--gold2:#e8c068;--gold3:#f0d080;
  --teal:#0e8a7a;--teal2:#13b09e;
  --rose:#c0392b;--rose2:#e74c3c;
  --sage:#2d6a4f;--sage2:#40916c;
  --slate:#f8f7f4;--slate2:#f0ede6;--slate3:#e8e4db;
  --ink:#1a1a2e;--ink2:#3d3d5c;--ink3:#7a7a9a;
  --brd:#ddd9d0;--brd2:#c8c2b8;
  --r:12px;--r2:8px;--r3:4px;
  --sh:0 1px 12px rgba(10,22,40,.08);
  --sh2:0 8px 32px rgba(10,22,40,.14);
  --sh3:0 24px 64px rgba(10,22,40,.22);
  --ff:'Plus Jakarta Sans',sans-serif;
  --fh:'Syne',sans-serif;
  --fm:'JetBrains Mono',monospace;
}
html,body{height:100%;background:var(--slate);color:var(--ink);font-family:var(--ff);font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-thumb{background:var(--brd2);border-radius:3px}

/* ─── LOGIN ─── */
.login-page{min-height:100vh;display:grid;grid-template-columns:1fr 1fr;background:var(--navy)}
.login-left{
  background:linear-gradient(145deg,var(--navy) 0%,var(--navy3) 60%,#1a3a6e 100%);
  display:flex;flex-direction:column;justify-content:space-between;padding:48px;
  position:relative;overflow:hidden;
}
.login-left::before{
  content:'';position:absolute;top:-100px;right:-100px;
  width:500px;height:500px;border-radius:50%;
  background:radial-gradient(circle,rgba(212,168,67,.12) 0%,transparent 70%);
}
.login-left::after{
  content:'';position:absolute;bottom:-80px;left:-80px;
  width:400px;height:400px;border-radius:50%;
  background:radial-gradient(circle,rgba(14,138,122,.1) 0%,transparent 70%);
}
.ll-brand{display:flex;align-items:center;gap:14px;position:relative;z-index:1}
.ll-logo{
  width:48px;height:48px;background:linear-gradient(135deg,var(--gold),var(--gold2));
  border-radius:13px;display:flex;align-items:center;justify-content:center;
  font-size:22px;box-shadow:0 4px 16px rgba(212,168,67,.35);
}
.ll-name{font-family:var(--fh);font-size:18px;font-weight:800;color:white;letter-spacing:.3px}
.ll-tagline{font-size:11px;color:rgba(255,255,255,.4);margin-top:1px}
.ll-hero{position:relative;z-index:1}
.ll-title{font-family:var(--fh);font-size:42px;font-weight:800;color:white;line-height:1.1;margin-bottom:16px}
.ll-title span{color:var(--gold)}
.ll-desc{font-size:14px;color:rgba(255,255,255,.55);max-width:340px;line-height:1.7}
.ll-features{display:flex;flex-direction:column;gap:10px;margin-top:28px;position:relative;z-index:1}
.ll-feat{display:flex;align-items:center;gap:10px;color:rgba(255,255,255,.7);font-size:13px}
.ll-feat-dot{width:6px;height:6px;border-radius:50%;background:var(--gold);flex-shrink:0}
.ll-footer{font-size:11px;color:rgba(255,255,255,.2);position:relative;z-index:1}
.login-right{
  background:var(--slate);display:flex;align-items:center;justify-content:center;padding:48px;
}
.login-box{width:100%;max-width:400px}
.lb-title{font-family:var(--fh);font-size:28px;font-weight:800;color:var(--navy);margin-bottom:6px}
.lb-sub{font-size:13px;color:var(--ink3);margin-bottom:32px}
.form-group{margin-bottom:16px}
.form-label{display:block;font-size:11px;font-weight:700;color:var(--ink2);margin-bottom:5px;text-transform:uppercase;letter-spacing:.6px}
.form-input{
  width:100%;background:white;border:1.5px solid var(--brd);border-radius:var(--r2);
  padding:11px 14px;color:var(--ink);font-family:var(--ff);font-size:13.5px;outline:none;transition:.15s;
}
.form-input:focus{border-color:var(--navy);box-shadow:0 0 0 3px rgba(10,22,40,.07)}
.btn-login{
  width:100%;padding:13px;background:linear-gradient(135deg,var(--navy),var(--navy3));
  border:none;border-radius:var(--r2);color:white;font-family:var(--fh);font-size:14px;
  font-weight:700;cursor:pointer;transition:.2s;letter-spacing:.3px;margin-top:6px;
}
.btn-login:hover{transform:translateY(-1px);box-shadow:0 8px 24px rgba(10,22,40,.25)}
.lb-demo{
  margin-top:20px;padding:12px 16px;background:rgba(212,168,67,.1);
  border:1px solid rgba(212,168,67,.3);border-radius:var(--r2);
  font-size:12px;color:var(--ink2);text-align:center;
}
.lb-demo strong{color:var(--navy);font-weight:700}
.login-sep{text-align:center;color:var(--ink3);font-size:11px;margin:14px 0;position:relative}
.login-sep::before,.login-sep::after{content:'';position:absolute;top:50%;width:42%;height:1px;background:var(--brd)}
.login-sep::before{left:0} .login-sep::after{right:0}

/* ─── SHELL ─── */
.shell{display:flex;height:100vh;overflow:hidden}
.main-area{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.content{flex:1;overflow-y:auto;background:var(--slate)}
.module{padding:28px 32px;max-width:1600px;margin:0 auto}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.module{animation:fadeUp .22s ease}

/* ─── SIDEBAR ─── */
.sidebar{
  width:260px;flex-shrink:0;
  background:linear-gradient(180deg,var(--navy) 0%,var(--navy2) 50%,#07111f 100%);
  display:flex;flex-direction:column;position:relative;
}
.sidebar::before{
  content:'';position:absolute;bottom:0;left:0;right:0;height:280px;
  background:radial-gradient(ellipse at bottom,rgba(212,168,67,.06),transparent 70%);
  pointer-events:none;
}
.sb-brand{padding:22px 18px 16px;border-bottom:1px solid rgba(255,255,255,.07);display:flex;align-items:center;gap:12px}
.sb-logo{
  width:38px;height:38px;background:linear-gradient(135deg,var(--gold),var(--gold2));
  border-radius:10px;display:flex;align-items:center;justify-content:center;
  font-size:17px;flex-shrink:0;box-shadow:0 3px 12px rgba(212,168,67,.3);
}
.sb-name{font-family:var(--fh);font-size:14px;font-weight:800;color:white}
.sb-ver{font-size:10px;color:rgba(255,255,255,.3);font-family:var(--fm);margin-top:1px}
.sb-client-wrap{padding:10px 10px;border-bottom:1px solid rgba(255,255,255,.06)}
.sb-client-label{font-size:9px;color:rgba(255,255,255,.3);text-transform:uppercase;letter-spacing:1.3px;margin-bottom:5px;display:block;font-weight:700}
.sb-client-sel{
  width:100%;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.13);
  border-radius:var(--r2);padding:7px 11px;color:white;font-family:var(--ff);font-size:12px;outline:none;cursor:pointer;
}
.sb-client-sel option{background:#0a1628}
.sb-nav{flex:1;padding:10px;overflow-y:auto;display:flex;flex-direction:column;gap:1px}
.nav-section{font-size:9px;font-weight:700;color:rgba(255,255,255,.22);letter-spacing:1.5px;padding:10px 10px 4px;text-transform:uppercase}
.nav-btn{
  width:100%;display:flex;align-items:center;gap:9px;padding:9px 12px;
  border-radius:var(--r2);background:transparent;border:none;
  color:rgba(255,255,255,.5);font-family:var(--ff);font-size:12.5px;font-weight:500;
  cursor:pointer;transition:.13s;text-align:left;
}
.nav-btn:hover{background:rgba(255,255,255,.08);color:rgba(255,255,255,.88)}
.nav-btn.active{background:rgba(255,255,255,.13);color:white;font-weight:600}
.nav-btn.active .nav-ic{filter:drop-shadow(0 0 4px rgba(212,168,67,.6))}
.nav-ic{font-size:14px;width:18px;text-align:center;flex-shrink:0}
.nav-lbl{flex:1}
.nav-badge{font-size:10px;font-weight:700;padding:2px 7px;border-radius:10px;background:var(--rose2);color:white}
.sb-footer{padding:12px 10px;border-top:1px solid rgba(255,255,255,.06);position:relative;z-index:1}
.sb-user{display:flex;align-items:center;gap:9px;padding:9px 11px;background:rgba(255,255,255,.07);border-radius:var(--r2);margin-bottom:7px}
.sb-avatar{
  width:32px;height:32px;background:linear-gradient(135deg,var(--gold),var(--gold2));
  border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-family:var(--fh);font-size:13px;font-weight:800;color:var(--navy);flex-shrink:0;
}
.sb-uname{font-size:12px;font-weight:600;color:white}
.sb-urole{font-size:10px;color:rgba(255,255,255,.38)}
.sb-logout{
  width:100%;padding:8px 11px;background:rgba(255,255,255,.05);border:none;
  border-radius:var(--r2);color:rgba(255,255,255,.45);font-family:var(--ff);
  font-size:12px;cursor:pointer;transition:.13s;display:flex;align-items:center;gap:7px;
}
.sb-logout:hover{background:rgba(192,57,43,.2);color:#ffaaaa}

/* ─── TOPBAR ─── */
.topbar{
  background:white;border-bottom:1px solid var(--brd);
  padding:14px 28px;display:flex;align-items:center;justify-content:space-between;
  box-shadow:0 1px 8px rgba(10,22,40,.05);position:sticky;top:0;z-index:100;
}
.tb-left{display:flex;align-items:center;gap:12px}
.tb-mod{font-family:var(--fh);font-size:15px;font-weight:700;color:var(--navy)}
.tb-chip{font-size:11px;font-weight:700;padding:3px 11px;border-radius:20px;background:#fef3de;color:#92620a;border:1px solid #f0d090}
.tb-ruc{font-size:11px;color:var(--ink3);font-family:var(--fm)}
.tb-right{display:flex;align-items:center;gap:9px}
.tb-period{
  background:var(--slate2);border:1.5px solid var(--brd);border-radius:var(--r2);
  padding:6px 11px;font-family:var(--ff);font-size:12px;color:var(--ink);outline:none;cursor:pointer;
}
.tb-period:focus{border-color:var(--navy)}
.online-dot{width:7px;height:7px;background:#27ae60;border-radius:50%;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

/* ─── BUTTONS ─── */
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:var(--r2);font-family:var(--ff);font-size:12.5px;font-weight:600;cursor:pointer;border:none;transition:.15s;white-space:nowrap;text-decoration:none}
.btn-p{background:linear-gradient(135deg,var(--navy),var(--navy3));color:white}
.btn-p:hover{transform:translateY(-1px);box-shadow:0 6px 18px rgba(10,22,40,.22)}
.btn-g{background:white;color:var(--ink2);border:1.5px solid var(--brd2)}
.btn-g:hover{background:var(--slate2);border-color:var(--navy);color:var(--navy)}
.btn-gold{background:linear-gradient(135deg,var(--gold),var(--gold2));color:var(--navy)}
.btn-gold:hover{transform:translateY(-1px);box-shadow:0 6px 18px rgba(212,168,67,.3)}
.btn-green{background:linear-gradient(135deg,var(--sage),var(--sage2));color:white}
.btn-green:hover{transform:translateY(-1px)}
.btn-red{background:#fff0f0;color:var(--rose2);border:1px solid #ffd0d0}
.btn-red:hover{background:#ffe4e4}
.btn-teal{background:linear-gradient(135deg,var(--teal),var(--teal2));color:white}
.btn-sm{padding:5px 11px;font-size:12px}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none!important}

/* ─── CARDS ─── */
.card{background:white;border:1px solid var(--brd);border-radius:var(--r);padding:20px;box-shadow:var(--sh)}
.card-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.card-title{font-family:var(--fh);font-size:14px;font-weight:700;color:var(--navy)}

/* ─── STATS ─── */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:20px}
.stat-card{
  background:white;border:1px solid var(--brd);border-radius:var(--r);
  padding:16px 18px;border-left:4px solid var(--sc,var(--navy));
  box-shadow:var(--sh);transition:.17s;cursor:default;
}
.stat-card:hover{transform:translateY(-2px);box-shadow:var(--sh2)}
.stat-lbl{font-size:10px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.9px;margin-bottom:6px}
.stat-val{font-size:22px;font-weight:800;color:var(--navy);font-family:var(--fh);line-height:1}
.stat-sub{font-size:11px;color:var(--ink3);margin-top:3px}

/* ─── TABLE ─── */
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12.5px}
thead th{padding:9px 13px;text-align:left;font-size:10px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.8px;border-bottom:2px solid var(--brd);background:var(--slate2);white-space:nowrap}
thead th.r{text-align:right}
tbody tr{border-bottom:1px solid var(--brd);transition:background .1s}
tbody tr:hover{background:var(--slate2)}
tbody td{padding:10px 13px;vertical-align:middle}
tbody tr:last-child{border-bottom:none}
tfoot td{padding:10px 13px;font-weight:700;background:var(--slate2);border-top:2px solid var(--brd2)}
.r{text-align:right} .mono{font-family:var(--fm)}

/* ─── BADGES ─── */
.badge{display:inline-flex;align-items:center;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:700}
.b-green{background:#d4edda;color:#155724}
.b-red{background:#f8d7da;color:#721c24}
.b-yellow{background:#fff3cd;color:#856404}
.b-blue{background:#d1ecf1;color:#0c5460}
.b-gray{background:var(--slate3);color:var(--ink2)}
.b-purple{background:#e8d5f5;color:#5a2d82}
.b-gold{background:#fef3de;color:#92620a}

/* ─── FORMS ─── */
.fg{margin-bottom:13px}
.fl{display:block;font-size:10.5px;font-weight:700;color:var(--ink2);margin-bottom:4px;text-transform:uppercase;letter-spacing:.5px}
.fi,.fsel,.fta{width:100%;background:var(--slate);border:1.5px solid var(--brd);border-radius:var(--r2);padding:9px 13px;color:var(--ink);font-family:var(--ff);font-size:13px;outline:none;transition:.15s}
.fi:focus,.fsel:focus,.fta:focus{border-color:var(--navy);box-shadow:0 0 0 3px rgba(10,22,40,.06);background:white}
.fi[readonly]{background:var(--slate3);color:var(--ink3)}
.fsel option{background:white}
.fta{resize:vertical;min-height:64px}
.fg2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fg3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.fg4{display:grid;grid-template-columns:repeat(4,1fr);gap:11px}
.span2{grid-column:span 2} .span3{grid-column:span 3} .span4{grid-column:span 4}

/* ─── MODAL ─── */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(5px);display:flex;align-items:center;justify-content:center;z-index:1000;animation:fadeIn .15s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{background:white;border-radius:16px;padding:28px;width:90%;max-width:560px;max-height:92vh;overflow-y:auto;animation:slideUp .2s cubic-bezier(.34,1.56,.64,1);box-shadow:var(--sh3)}
.modal-lg{max-width:820px} .modal-xl{max-width:1060px}
@keyframes slideUp{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
.modal-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;padding-bottom:15px;border-bottom:2px solid var(--brd)}
.modal-title{font-family:var(--fh);font-size:17px;font-weight:800;color:var(--navy)}
.modal-footer{display:flex;justify-content:flex-end;gap:9px;margin-top:20px;padding-top:16px;border-top:1px solid var(--brd)}

/* ─── TOOLBAR ─── */
.toolbar{display:flex;align-items:center;gap:9px;margin-bottom:14px;flex-wrap:wrap}
.search-wrap{position:relative;min-width:160px;max-width:280px;flex:1}
.search-icon{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--ink3);font-size:13px;pointer-events:none}
.search-input{width:100%;background:white;border:1.5px solid var(--brd);border-radius:var(--r2);padding:8px 12px 8px 32px;color:var(--ink);font-family:var(--ff);font-size:13px;outline:none;transition:.15s}
.search-input:focus{border-color:var(--navy)}

/* ─── TABS ─── */
.tabs{display:flex;gap:0;margin-bottom:18px;border-bottom:2px solid var(--brd);overflow-x:auto}
.tab{padding:9px 18px;border:none;background:transparent;font-family:var(--ff);font-size:12.5px;font-weight:600;color:var(--ink3);cursor:pointer;transition:.13s;border-bottom:2.5px solid transparent;margin-bottom:-2px;white-space:nowrap}
.tab:hover{color:var(--navy)}
.tab.active{color:var(--navy);border-bottom-color:var(--gold)}

/* ─── GRIDS ─── */
.g2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}

/* ─── PAGE HEADER ─── */
.ph{margin-bottom:22px}
.ph-row{display:flex;justify-content:space-between;align-items:flex-start;gap:14px}
.ph h1{font-family:var(--fh);font-size:24px;font-weight:800;color:var(--navy)}
.ph p{color:var(--ink3);font-size:12.5px;margin-top:3px}

/* ─── CLIENTE CARD ─── */
.cli-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:15px}
.cli-card{
  background:white;border:1.5px solid var(--brd);border-radius:var(--r);padding:18px;
  cursor:pointer;transition:.18s;position:relative;overflow:hidden;
}
.cli-card::before{content:'';position:absolute;top:0;left:0;width:4px;height:100%;background:var(--cli-color,var(--navy))}
.cli-card:hover{border-color:var(--navy);box-shadow:var(--sh2);transform:translateY(-2px)}
.cli-name{font-family:var(--fh);font-size:14px;font-weight:700;color:var(--navy)}
.cli-ruc{font-size:11px;color:var(--ink3);font-family:var(--fm);margin-top:2px}
.cli-info{display:flex;flex-direction:column;gap:4px;margin:11px 0}
.cli-row{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink2)}
.cli-footer{display:flex;align-items:center;justify-content:space-between;padding-top:11px;border-top:1px solid var(--brd);margin-top:4px}

/* ─── PDT BOX ─── */
.pdt-box{
  background:linear-gradient(145deg,var(--navy),var(--navy2));
  border-radius:var(--r);padding:22px 26px;color:white;
}
.pdt-title{font-family:var(--fh);font-size:15px;font-weight:700;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.pdt-section{font-size:10px;opacity:.45;text-transform:uppercase;letter-spacing:.9px;margin:13px 0 6px}
.pdt-row{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid rgba(255,255,255,.08);font-size:13px}
.pdt-row:last-child{border:none}
.pdt-row.total{border-top:2px solid rgba(255,255,255,.2);margin-top:8px;padding-top:12px;font-size:16px;font-weight:800}
.pdt-lbl{opacity:.7}
.pdt-val{font-family:var(--fm);font-weight:700}
.pdt-pos{color:#6ee7b7} .pdt-neg{color:#fca5a5}

/* ─── ASIENTO ─── */
.asiento-card{background:white;border:1px solid var(--brd);border-radius:var(--r);margin-bottom:10px;overflow:hidden;transition:.15s}
.asiento-card:hover{border-color:var(--navy);box-shadow:var(--sh)}
.as-hdr{padding:12px 18px;background:var(--slate2);display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none}
.as-num{font-family:var(--fm);font-size:11px;font-weight:700;color:var(--navy);background:rgba(10,22,40,.1);padding:2px 9px;border-radius:20px;flex-shrink:0}
.as-glosa{font-size:13px;font-weight:600;flex:1;color:var(--ink)}
.as-fecha{font-size:11px;color:var(--ink3);font-family:var(--fm);flex-shrink:0}
.as-body{display:none;padding:14px 18px}
.as-body.open{display:block}

/* ─── AP BOX (asiento preview) ─── */
.ap-box{background:var(--slate2);border-radius:var(--r2);padding:16px;margin-top:14px;border:1px solid var(--brd)}
.ap-hdr{font-size:10px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.9px;margin-bottom:10px}
.ap-row{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid var(--brd);font-size:12.5px}
.ap-row:last-of-type{border:none}
.ap-cta{font-family:var(--fm);font-weight:700;color:var(--navy);width:44px;flex-shrink:0}
.ap-nom{flex:1}
.ap-D{width:100px;text-align:right;font-family:var(--fm);color:var(--sage2);font-weight:600}
.ap-H{width:100px;text-align:right;font-family:var(--fm);color:var(--rose2);font-weight:600}
.ap-tot{display:flex;justify-content:space-between;margin-top:9px;padding-top:8px;border-top:2px solid var(--brd2);font-weight:800;font-family:var(--fm);font-size:13px}

/* ─── NOTIF ─── */
.notifs{position:fixed;top:18px;right:18px;z-index:9999;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.notif{background:white;border:1px solid var(--brd);border-radius:var(--r);padding:12px 18px;font-size:13px;display:flex;align-items:center;gap:10px;box-shadow:var(--sh2);animation:slideUp .18s ease;min-width:250px;font-weight:500;pointer-events:auto}
.notif.ok{border-left:4px solid var(--sage2)}
.notif.err{border-left:4px solid var(--rose2)}
.notif.info{border-left:4px solid var(--navy)}

/* ─── FIREBASE BANNER ─── */
.fb-banner{background:#fffbeb;border:1.5px solid #f0d090;border-radius:var(--r);padding:14px 18px;display:flex;align-items:center;gap:12px;margin-bottom:20px}
.fb-banner-body{flex:1}
.fb-banner-title{font-weight:700;font-size:13px;color:#92620a;margin-bottom:2px}
.fb-banner-text{font-size:12px;color:var(--ink3)}

/* ─── PROGRESS BAR ─── */
.prog{background:var(--slate3);border-radius:3px;height:7px;overflow:hidden;margin-top:7px}
.prog-fill{height:100%;border-radius:3px;transition:.4s}

/* ─── EMPTY ─── */
.empty-state{text-align:center;padding:50px 20px;color:var(--ink3)}
.empty-state .es-icon{font-size:48px;margin-bottom:12px}
.empty-state p{font-size:13px}

/* ─── DET HDR ─── */
.det-hdr{
  background:linear-gradient(135deg,var(--navy),var(--navy3));
  border-radius:var(--r);padding:24px 28px;color:white;margin-bottom:20px;
  display:flex;align-items:center;justify-content:space-between;
}
.dh-av{width:52px;height:52px;background:rgba(255,255,255,.15);border-radius:13px;display:flex;align-items:center;justify-content:center;font-family:var(--fh);font-size:22px;font-weight:800;flex-shrink:0}
.dh-name{font-family:var(--fh);font-size:20px;font-weight:800}
.dh-ruc{font-size:12px;opacity:.65;font-family:var(--fm);margin-top:2px}
.dh-badge{font-size:11px;font-weight:700;padding:3px 11px;border-radius:20px;background:rgba(255,255,255,.18);color:white;display:inline-block;margin-top:6px}

/* ─── PCGE SEL ─── */
.as-table{width:100%;border-collapse:collapse;font-size:12.5px}
.as-table th{padding:7px 11px;text-align:left;font-size:10px;font-weight:700;color:white;text-transform:uppercase;letter-spacing:.8px;border-bottom:2px solid var(--brd);background:var(--navy)}
.as-table th.r{text-align:right}
.as-table td{padding:8px 11px;border-bottom:1px solid var(--brd)}
.as-table tfoot td{background:var(--slate2);font-weight:700;border-top:2px solid var(--brd2)}
.as-D{color:var(--sage2)} .as-H{color:var(--rose2)}

@media(max-width:768px){
  .sidebar{display:none}
  .login-page{grid-template-columns:1fr}
  .login-left{display:none}
  .g2,.g3,.g4{grid-template-columns:1fr}
  .fg2,.fg3,.fg4{grid-template-columns:1fr}
  .span2,.span3,.span4{grid-column:1}
  .module{padding:15px}
  .stats-grid{grid-template-columns:repeat(2,1fr)}
}

<script>
// ══════════════════════════════════════════════
// CONSTANTES PERÚ 2026
// ══════════════════════════════════════════════
const RMV=1025,UIT=5350,IGV=0.18,ESSALUD=0.09;
const AFP={Prima:{ap:.10,seg:.0174,com:.016},Integra:{ap:.10,seg:.0155,com:.0155},Habitat:{ap:.10,seg:.0147,com:.0138},Profuturo:{ap:.10,seg:.0117,com:.021},ONP:{ap:.13,seg:0,com:0}};

// ══════════════════════════════════════════════
// ESTADO GLOBAL
// ══════════════════════════════════════════════
const ST={user:null,userName:'',fbOk:false,clientes:[],clienteActivo:null,periodo:'2026-03',mod:'dashboard',_d:{}};

// ══════════════════════════════════════════════
// HELPERS
// ══════════════════════════════════════════════
const $=id=>document.getElementById(id);
const esc=s=>String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const fmt=n=>new Intl.NumberFormat('es-PE',{minimumFractionDigits:2,maximumFractionDigits:2}).format(n||0);
const S=n=>'S/ '+fmt(n);
const hoy=()=>new Date().toISOString().split('T')[0];
const diasR=d=>{if(!d)return 999;const h=new Date();h.setHours(0,0,0,0);return Math.ceil((new Date(d+'T00:00:00')-h)/86400000)};
const regLbl=r=>({RG:'Régimen General',RMT:'MYPE Tributario',RS:'Régimen Especial',RUS:'RUS'}[r]||r);
const regColor=r=>({RG:'#0a1628',RMT:'#2d6a4f',RS:'#5c2d8a',RUS:'#b8860b'}[r]||'#0a1628');
const getData=k=>(ST._d[ST.clienteActivo]||{})[k]||[];
const setData=(k,v)=>{if(!ST._d[ST.clienteActivo])ST._d[ST.clienteActivo]={};ST._d[ST.clienteActivo][k]=v};

function notify(msg,type='ok'){
  const d=document.createElement('div');d.className='notif '+type;
  const ic=type==='ok'?'✓':type==='err'?'✕':'ℹ';
  d.innerHTML='<span>'+ic+'</span> '+esc(msg);
  $('notifs').appendChild(d);setTimeout(()=>d.remove(),3500);
}

// ══════════════════════════════════════════════
// CALCULOS CONTABLES
// ══════════════════════════════════════════════
function calcTrab(t){
  const s=t.remuneracion,a=AFP[t.afp]||AFP.Prima,mp=t.regLaboral==='mype';
  const ess=s*ESSALUD,desc=s*(a.ap+a.seg+a.com),neto=s-desc;
  const cts=mp?(s*0.5/12):(s+ess)/12,vac=mp?(s*0.5/12):(s/12);
  const grat=mp?0:(s/6),bonif=mp?0:(grat*0.09);
  return{s,ess,desc,neto,cts,vac,grat,bonif,costo:s+ess+cts+vac+grat+bonif,mp};
}
function calcPlanilla(){return getData('trabajadores').reduce((a,t)=>{const c=calcTrab(t);return{sue:a.sue+c.s,ess:a.ess+c.ess,cts:a.cts+c.cts,vac:a.vac+c.vac,grat:a.grat+c.grat,bon:a.bon+c.bonif,costo:a.costo+c.costo,desc:a.desc+c.desc}},{sue:0,ess:0,cts:0,vac:0,grat:0,bon:0,costo:0,desc:0})}
function calcImp(){
  const vs=getData('ventas'),cs=getData('compras');
  const bV=vs.reduce((s,v)=>s+v.base,0),igvV=vs.reduce((s,v)=>s+v.igv,0);
  const igvC=cs.filter(c=>c.credito).reduce((s,c)=>s+c.igv,0),igvP=Math.max(0,igvV-igvC);
  const cl=ST.clientes.find(c=>c.id===ST.clienteActivo)||{};
  const coef=cl.regimen==='RG'?0.015:cl.regimen==='RMT'?0.01:0;
  return{bV,igvV,igvC,igvP,coef,pagoCta:bV*coef,total:igvP+bV*coef};
}
function calcDep(a){const m=a.valor/a.vida/12,acum=a.acum+m,neto=a.valor-acum;return{m,anual:a.valor/a.vida,acum,neto,meses:Math.max(0,a.vida*12-Math.round(a.acum/m)||0)}}
function provIncob(i){const d=i.dias;return i.monto*(d>=360?.6:d>=181?.2:d>=91?.1:d>=30?.05:0)}

function buildAsPS(){const p=calcPlanilla(),ps=[];
  if(p.sue)ps.push({cta:'621',nom:'Remuneraciones',D:p.sue,H:0});
  if(p.ess)ps.push({cta:'627',nom:'ESSALUD 9%',D:p.ess,H:0});
  if(p.cts)ps.push({cta:'625',nom:'Provisión CTS',D:p.cts,H:0});
  if(p.vac)ps.push({cta:'621',nom:'Provisión vacaciones',D:p.vac,H:0});
  if(p.grat)ps.push({cta:'621',nom:'Provisión gratificaciones',D:p.grat,H:0});
  if(p.bon)ps.push({cta:'621',nom:'Bonif. ext. 9% Ley 29351',D:p.bon,H:0});
  const neto=p.sue-p.desc;
  if(neto>0)ps.push({cta:'411',nom:'Remuneraciones por pagar',D:0,H:neto});
  if(p.desc)ps.push({cta:'401',nom:'AFP/ONP por pagar',D:0,H:p.desc});
  if(p.ess)ps.push({cta:'401',nom:'ESSALUD por pagar',D:0,H:p.ess});
  if(p.cts)ps.push({cta:'415',nom:'CTS por depositar',D:0,H:p.cts});
  if(p.vac)ps.push({cta:'415',nom:'Vacaciones por pagar',D:0,H:p.vac});
  if(p.grat+p.bon)ps.push({cta:'415',nom:'Gratificaciones por pagar',D:0,H:p.grat+p.bon});
  return ps;
}
function buildAsImp(){const i=calcImp();return i.igvP+i.pagoCta>0?[{cta:'641',nom:'IGV neto',D:i.igvP,H:0},{cta:'641',nom:'IR pago a cuenta',D:i.pagoCta,H:0},{cta:'4011',nom:'IGV por pagar',D:0,H:i.igvP},{cta:'4017',nom:'IR por pagar',D:0,H:i.pagoCta}]:[];}
function buildAsDep(){const t=getData('activos').reduce((s,a)=>s+calcDep(a).m,0);return t>0?[{cta:'681',nom:'Depreciación activos fijos',D:t,H:0},{cta:'393',nom:'Depreciación acumulada',D:0,H:t}]:[];}
function buildAsIncob(){const t=getData('incobrables').reduce((s,i)=>s+provIncob(i),0);return t>0?[{cta:'684',nom:'Estimación cobranza dudosa',D:t,H:0},{cta:'191',nom:'Provisión cobranza dudosa',D:0,H:t}]:[];}

function renderAP(ps,titulo){
  if(!ps.length)return'';
  const tD=ps.reduce((s,p)=>s+p.D,0),tH=ps.reduce((s,p)=>s+p.H,0),ok=Math.abs(tD-tH)<.01;
  return '<div class="ap-box"><div class="ap-hdr">'+esc(titulo)+'</div>'+
    ps.map(p=>'<div class="ap-row"><span class="ap-cta">'+p.cta+'</span><span class="ap-nom">'+esc(p.nom)+'</span><span class="ap-D">'+(p.D>0?S(p.D):'—')+'</span><span class="ap-H">'+(p.H>0?S(p.H):'—')+'</span></div>').join('')+
    '<div class="ap-tot"><span style="color:'+(ok?'var(--sage2)':'var(--rose2)')+'">'+( ok?'✓ Cuadra':'⚠ No cuadra')+'</span><span><span style="color:var(--sage2)">'+S(tD)+'</span> / <span style="color:var(--rose2)">'+S(tH)+'</span></span></div></div>';
}

async function fbSave(col,data){if(!ST.fbOk||!window.FB.ready)return null;try{const r=await window.FB.db.collection(col).add({...data,_ts:new Date()});return r.id;}catch(e){notify('Firebase: '+e.message,'err');return null;}}
async function fbUpdate(col,id,data){if(!ST.fbOk||!window.FB.ready)return;try{await window.FB.db.collection(col).doc(id).update(data);}catch(e){notify('Firebase: '+e.message,'err');}}
async function fbDelete(col,id){if(!ST.fbOk||!window.FB.ready)return;try{await window.FB.db.collection(col).doc(id).delete();}catch(e){notify('Firebase: '+e.message,'err');}}
async function fbGetAll(col){if(!ST.fbOk||!window.FB.ready)return[];try{const s=await window.FB.db.collection(col).get();return s.docs.map(d=>({id:d.id,...d.data()}));}catch(e){return[];}}

function doLogin(){
  const email=$('li-email')?.value.trim(),pass=$('li-pass')?.value;
  if(!email||!pass){notify('Completa email y contraseña','err');return;}
  const btn=$('li-btn');btn.disabled=true;btn.textContent='Ingresando...';
  if(window.FB_OK){
    window.FB.auth.signInWithEmailAndPassword(email,pass)
      .then(uc=>{ST.user=uc.user;ST.userName=email.split('@')[0];ST.fbOk=true;loadFirebase().then(()=>renderApp());})
      .catch(e=>{notify('Error: '+e.message,'err');btn.disabled=false;btn.textContent='Ingresar al sistema →';});
  } else {
    doLoginDemo();
  }

function rDashboard(){
  const allD=ST.clientes.flatMap(c=>(ST._d[c.id]||{}).declaraciones||[]);
  const pend=allD.filter(d=>d.estado==='pendiente').length;
  const pres=allD.filter(d=>d.estado==='presentada').length;
  const venc=allD.filter(d=>d.estado==='vencida').length;
  const urg=allD.filter(d=>d.estado!=='presentada'&&diasR(d.vencimiento)<=7).sort((a,b)=>new Date(a.vencimiento)-new Date(b.vencimiento));
  const p=calcPlanilla(),imp=calcImp();
  const depT=getData('activos').reduce((s,a)=>s+calcDep(a).m,0);
  const provT=p.costo+imp.total+depT;
  const cl=ST.clientes.find(c=>c.id===ST.clienteActivo)||{};

  var urgRows=urg.slice(0,5).map(function(d){
    var dias=diasR(d.vencimiento);
    var col=dias<=3?'var(--rose2)':dias<=7?'#d4a843':'var(--ink3)';
    return '<div style="display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--brd)">'+
      '<div><div style="font-weight:600;font-size:13px">'+esc(d.tipo)+'</div>'+

      '<div style="text-align:right">'+
        '<div style="font-family:var(--fm);font-size:12px;font-weight:700;color:'+col+'">'+d.vencimiento+'</div>'+
        '<div style="font-size:11px;font-weight:700;color:'+col+'">'+(dias<=0?'VENCIDO':dias===1?'Mañana':dias+' días')+'</div>'+
      '</div></div>';
  }).join('');

  window._provMods=['planilla','pdt621','depreciacion'];
  var provCards=[
    {ic:'💰',l:'Planilla',v:p.costo,col:'#2d6a4f',idx:0},
    {ic:'🏛',l:'SUNAT',v:imp.total,col:'#d4a843',idx:1},
    {ic:'📉',l:'Depreciación',v:depT,col:'#5c2d8a',idx:2}
  ];
  var provRows=provCards.map(function(x){
    var pct=provT?fmt(x.v/provT*100):0;
    return '<div style="display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--brd);cursor:pointer" onclick="navTo(window._provMods['+x.idx+'])">'+
      '<span style="font-size:20px">'+x.ic+'</span>'+
      '<span style="flex:1;font-weight:600;font-size:13px">'+x.l+'</span>'+
      '<div style="width:70px;height:5px;background:var(--slate3);border-radius:3px;overflow:hidden">'+
        '<div style="width:'+pct+'%;height:100%;background:'+x.col+';border-radius:3px"></div>'+
      '</div>'+
      '<span style="font-family:var(--fm);font-weight:700;color:'+x.col+';min-width:88px;text-align:right;font-size:12px">'+S(x.v)+'</span>'+
    '</div>';
  }).join('');

  var statCards=[
    ['CLIENTES',ST.clientes.length,'registrados','#0a1628'],
    ['PENDIENTES',pend,'declaraciones','#d4a843'],
    ['PRESENTADAS',pres,'este período','#2d6a4f'],
    ['VENCIDAS',venc,'urgente','#c0392b'],
    ['PROV. MES',S(provT),esc(cl.razonSocial||'—'),'#0e8a7a']
  ];
  var statsHtml=statCards.map(function(x){
    var fsize=x[0]==='PROV. MES'?'15px':'22px';
    return '<div class="stat-card" style="--sc:'+x[3]+'">'+
      '<div class="stat-lbl">'+x[0]+'</div>'+
      '<div class="stat-val" style="font-size:'+fsize+';color:'+x[3]+'">'+x[1]+'</div>'+
      '<div class="stat-sub">'+x[2]+'</div></div>';
  }).join('');

  var bmap={presentada:'b-green',pendiente:'b-yellow','en-proceso':'b-blue',vencida:'b-red'};
  var declRows=allD.slice(0,5).map(function(d){
    var dias=diasR(d.vencimiento);
    var col=dias<=5&&d.estado!=='presentada'?'var(--rose2)':'var(--ink3)';
    return '<tr>'+
      '<td style="font-weight:600">'+esc(d.tipo)+'</td>'+
      '<td style="font-family:var(--fm);font-size:12px">'+d.periodo+'</td>'+
      '<td><span class="badge '+(bmap[d.estado]||'b-gray')+'">'+d.estado+'</span></td>'+
      '<td style="font-size:12px;color:'+col+'">'+d.vencimiento+'</td>'+
      '<td class="r mono">'+(d.igv?S(d.igv):'—')+'</td>'+
      '<td class="r mono">'+(d.renta?S(d.renta):'—')+'</td></tr>';
  }).join('');

  return '<div class="ph"><div class="ph-row"><div><h1>Dashboard General</h1>'+
    '<p>'+new Date().toLocaleDateString('es-PE',{weekday:'long',year:'numeric',month:'long',day:'numeric'})+'</p></div></div></div>'+
    '<div class="stats-grid" style="grid-template-columns:repeat(5,1fr)">'+statsHtml+'</div>'+
    '<div class="g2" style="margin-bottom:16px">'+
      '<div class="card"><div class="card-hdr"><span class="card-title">⚠ Vencimientos Urgentes</span>'+
        '<button class="btn btn-sm btn-g" onclick="navTo('calendario')">Ver todos</button></div>'+
        (urg.length?urgRows:'<div class="empty-state"><div class="es-icon">✅</div><p>Sin vencimientos urgentes</p></div>')+
      '</div>'+
      '<div class="card"><div class="card-hdr"><span class="card-title">Provisiones · '+esc(cl.razonSocial||'—')+'</span></div>'+
        provRows+
        '<div style="display:flex;justify-content:flex-end;padding-top:10px;font-weight:800;color:var(--navy);font-family:var(--fh)">Total: '+S(provT)+'</div>'+
      '</div>'+
    '</div>'+
    '<div class="card"><div class="card-hdr"><span class="card-title">Últimas Declaraciones</span>'+
      '<button class="btn btn-sm btn-g" onclick="navTo('declaraciones')">Ver todas</button></div>'+
      '<div class="table-wrap"><table><thead><tr><th>Tipo</th><th>Período</th><th>Estado</th><th>Vencimiento</th><th class="r">IGV</th><th class="r">Renta</th></tr></thead>'+
      '<tbody>'+(declRows||'<tr><td colspan="6"><div class="empty-state"><div class="es-icon">📋</div><p>Sin declaraciones</p></div></td></tr>')+'</tbody>'+
      '</table></div></div>';
}

async function saveCli(editId){
  const rs=$('cr-rs')?.value.trim(),ruc=$('cr-ruc')?.value.trim();
  if(!rs||!ruc){notify('Razón social y RUC son requeridos','err');return;}
  const obj={razonSocial:rs,ruc,regimen:$('cr-reg').value,responsable:$('cr-resp').value,email:$('cr-email').value,telefono:$('cr-tel').value,periodoInicio:$('cr-ini').value,direccion:$('cr-dir').value,notas:$('cr-not').value,activo:true};
  if(editId){await fbUpdate('clientes',editId,obj);const idx=ST.clientes.findIndex(c=>c.id===editId);if(idx>=0)ST.clientes[idx]={...ST.clientes[idx],...obj};notify('Cliente actualizado ✓');}
  else{const id=await fbSave('clientes',obj)||('c_'+Date.now());ST.clientes.unshift({id,...obj});if(!ST._d[id])ST._d[id]={trabajadores:[],ventas:[],compras:[],activos:[],incobrables:[],asientos:[],declaraciones:[]};notify('Cliente registrado ✓');}
  closeModal();renderApp();
}

function asRender(opts){
  const co=opts||PCGE.map(([k,v])=>'<option value="'+k+'">'+k+' — '+v+'</option>').join('');
  const tb=$('as-tb');if(!tb)return;
  tb.innerHTML=asPs.map((p,i)=>'<tr>'+
    '<td><select class="fsel" style="font-size:12px;padding:5px 8px" onchange="asUp('+i+','cta',this.value)"><option value="">-- Cuenta --</option>'+co.replace('value="'+p.cta+'"','value="'+p.cta+'" selected')+'</select></td>'+
    '<td style="font-size:12px;color:var(--ink3)">'+(PCGE.find(([k])=>k===p.cta)?.[1]||'')+'</td>'+

    '<td><button class="btn btn-sm btn-red" style="padding:4px 7px" onclick="asRem('+i+')">✕</button></td></tr>'

function asUp(i,f,v){asPs[i][f]=f==='cta'?v:parseFloat(v)||0;if(f==='cta')asRender();else asUpdT();}
function asAddRow(){asPs.push({cta:'',nom:'',D:0,H:0});asRender();}
function asRem(i){asPs.splice(i,1);asRender();}
function asUpdT(){const D=asPs.reduce((s,p)=>s+p.D,0),H=asPs.reduce((s,p)=>s+p.H,0);const tD=$('as-tD'),tH=$('as-tH'),err=$('as-err');if(tD)tD.textContent=S(D);if(tH)tH.textContent=S(H);if(err)err.style.display=Math.abs(D-H)<.01||D===0?'none':'block';}
function saveAs(editId){
  const g=$('as-g')?.value.trim(),f=$('as-f')?.value;
  if(!g||!f){notify('Completa fecha y glosa','err');return;}

  if(Math.abs(D-H)>.01){notify('El asiento no cuadra','err');return;}
  const obj={fecha:f,numero:$('as-n').value,glosa:g,partidas:asPs.map(p=>({...p,nom:PCGE.find(([k])=>k===p.cta)?.[1]||p.nom}))};
  const arr=getData('asientos');
  if(editId){const idx=arr.findIndex(a=>a.id===editId);if(idx>=0)arr[idx]={...arr[idx],...obj};notify('Asiento actualizado ✓');}
  else{arr.unshift({id:'A'+Date.now(),...obj});notify('Asiento registrado ✓');}
  closeModal();renderModule('diario');
}

// ══════════════════════════════════════════════
function exportExcel(){
  const cl=ST.clientes.find(c=>c.id===ST.clienteActivo)||{};
  const wb=XLSX.utils.book_new();
  const rD=[['N°','Fecha','Glosa','Cuenta','Descripción','Debe','Haber']];
  getData('asientos').forEach(a=>a.partidas.forEach(p=>rD.push([a.numero,a.fecha,a.glosa,p.cta,p.nom||'',p.D,p.H])));
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(rD),'Libro Diario');
  const rV=[['Fecha','Serie','Número','RUC','Cliente','Base','IGV','Total']];
  getData('ventas').forEach(v=>rV.push([v.fecha,v.serie,v.numero,v.rucCli,v.cliente,v.base,v.igv,v.total]));
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(rV),'Reg. Ventas');
  const rC=[['Fecha','Serie','Número','RUC','Proveedor','Base','IGV','Total','Crédito']];
  getData('compras').forEach(c=>rC.push([c.fecha,c.serie,c.numero,c.rucProv,c.proveedor,c.base,c.igv,c.total,c.credito?'Sí':'No']));
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(rC),'Reg. Compras');
  const p=calcPlanilla(),rP=[['Trabajador','Cargo','AFP','Sueldo','ESSALUD','Desc.','Neto','CTS','Vacac.','Gratis.','Costo']];
  getData('trabajadores').forEach(t=>{const c=calcTrab(t);rP.push([t.nombre,t.cargo,t.afp,c.s,c.ess,c.desc,c.neto,c.cts,c.vac,c.grat,c.costo])});
  rP.push(['TOTALES','','',p.sue,p.ess,p.desc,p.sue-p.desc,p.cts,p.vac,p.grat,p.costo]);
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(rP),'Planilla');
  const rA=[['Activo','Categoría','Valor','Vida','Dep.Mes','Dep.Año','Dep.Acum.','Neto']];
  getData('activos').forEach(a=>{const d=calcDep(a);rA.push([a.desc,a.cat,a.valor,a.vida,d.m,d.anual,d.acum,d.neto])});
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(rA),'Depreciación');
  const i=calcImp();
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([['PDT 621 — '+cl.razonSocial],['RUC',cl.ruc],['Período',ST.periodo],[],['Campo','Casilla','Valor'],['Base ventas','100',i.bV],['IGV débito','101',i.igvV],['IGV crédito','108',i.igvC],['IGV a pagar','109',i.igvP],['Pago cta. IR','303',i.pagoCta],['TOTAL','—',i.total]]),'PDT 621');
  XLSX.writeFile(wb,'ContaGestion_'+cl.razonSocial+'_'+ST.periodo+'.xlsx');
  notify('Excel exportado: 6 hojas ✓');
}

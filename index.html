<style>
:root {
  --bg:#f0ede8; --bg2:#ffffff; --bg3:#e8e4dd; --bg4:#ddd9d0;
  --acc:#0f2d4a; --acc2:#c8832e; --acc3:#1e5c3a; --acc4:#b83030; --acc5:#5c2d8a; --acc6:#0a6080;
  --txt:#181828; --txt2:#52526a; --txt3:#9090a8;
  --brd:#dbd6ce; --brd2:#c8c2b8;
  --r:10px; --r2:7px; --r3:4px;
  --ff:'DM Sans',sans-serif; --fh:'Syne',sans-serif; --fm:'JetBrains Mono',monospace;
  --sh:0 1px 10px rgba(15,45,74,.07); --sh2:0 6px 28px rgba(15,45,74,.13); --sh3:0 16px 56px rgba(15,45,74,.18);
  --sw:256px;
  --sidebar-bg: linear-gradient(180deg, #0f2d4a 0%, #0a2038 60%, #071525 100%);
}
*, *::before, *::after { box-sizing:border-box; margin:0; padding:0 }
html, body { height:100%; background:var(--bg); color:var(--txt); font-family:var(--ff); font-size:14px; line-height:1.6; -webkit-font-smoothing:antialiased }
::-webkit-scrollbar { width:4px; height:4px }
::-webkit-scrollbar-thumb { background:var(--brd2); border-radius:2px }

/* ── LOGIN ── */
.login-wrap { min-height:100vh; display:flex; align-items:center; justify-content:center; background:var(--acc); position:relative; overflow:hidden }
.login-wrap::before { content:''; position:absolute; inset:0; background:repeating-linear-gradient(45deg,transparent,transparent 40px,rgba(255,255,255,.015) 40px,rgba(255,255,255,.015) 80px) }
.login-wrap::after { content:''; position:absolute; bottom:-120px; right:-120px; width:400px; height:400px; border-radius:50%; background:radial-gradient(circle,rgba(200,131,46,.18),transparent 70%) }
.login-box { background:white; border-radius:16px; padding:44px 40px; width:420px; position:relative; z-index:1; box-shadow:var(--sh3); animation:fadeUp .4s ease }
.login-brand { display:flex; align-items:center; gap:13px; margin-bottom:32px }
.login-icon { width:50px; height:50px; background:var(--acc); border-radius:13px; display:flex; align-items:center; justify-content:center; font-size:22px; color:white; flex-shrink:0 }
.login-brand-name { font-family:var(--fh); font-size:20px; font-weight:800; color:var(--acc) }
.login-brand-sub { font-size:11px; color:var(--txt3) }
.login-title { font-family:var(--fh); font-size:24px; font-weight:800; margin-bottom:5px }
.login-sub { font-size:13px; color:var(--txt2); margin-bottom:26px }
.login-demo { margin-top:14px; padding:11px 14px; background:var(--bg3); border-radius:var(--r2); font-size:12px; color:var(--txt2); text-align:center }
.login-demo strong { color:var(--acc) }

/* ── SHELL ── */
.shell { display:flex; height:100vh; overflow:hidden }
.main-area { flex:1; display:flex; flex-direction:column; overflow:hidden; min-width:0 }
.content { flex:1; overflow-y:auto; background:var(--bg) }
.module { padding:26px 30px; max-width:1500px; margin:0 auto; animation:fadeUp .22s ease }
@keyframes fadeUp { from { opacity:0; transform:translateY(5px) } to { opacity:1; transform:none } }

/* ── SIDEBAR ── */
.sidebar { width:var(--sw); background:var(--sidebar-bg); display:flex; flex-direction:column; flex-shrink:0; position:relative }
.sidebar::after { content:''; position:absolute; bottom:0; left:0; right:0; height:200px; background:radial-gradient(ellipse at bottom,rgba(200,131,46,.08),transparent 70%); pointer-events:none }
.sb-brand { padding:20px 16px 16px; border-bottom:1px solid rgba(255,255,255,.08); display:flex; align-items:center; gap:11px }
.sb-logo { width:36px; height:36px; background:var(--acc2); border-radius:9px; display:flex; align-items:center; justify-content:center; font-size:16px; font-weight:800; color:white; flex-shrink:0 }
.sb-name { font-family:var(--fh); font-size:14px; font-weight:700; color:white; letter-spacing:.3px }
.sb-ver { font-size:10px; color:rgba(255,255,255,.35); font-family:var(--fm) }
.sb-cli-wrap { padding:10px 8px; border-bottom:1px solid rgba(255,255,255,.06) }
.sb-cli-lbl { font-size:9px; color:rgba(255,255,255,.3); text-transform:uppercase; letter-spacing:1.2px; margin-bottom:5px; display:block }
.sb-cli-sel { width:100%; background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.14); border-radius:var(--r2); padding:7px 11px; color:white; font-family:var(--ff); font-size:12px; outline:none; cursor:pointer }
.sb-cli-sel option { background:#0f2d4a }
.sb-nav { flex:1; padding:10px 8px; display:flex; flex-direction:column; gap:1px; overflow-y:auto }
.nav-grp { font-size:9px; font-weight:700; color:rgba(255,255,255,.25); letter-spacing:1.4px; padding:10px 10px 4px; text-transform:uppercase }
.nav-btn { width:100%; display:flex; align-items:center; gap:9px; padding:9px 11px; border-radius:var(--r2); background:transparent; border:none; color:rgba(255,255,255,.55); font-family:var(--ff); font-size:12.5px; font-weight:500; cursor:pointer; transition:.13s; text-align:left }
.nav-btn:hover { background:rgba(255,255,255,.09); color:rgba(255,255,255,.9) }
.nav-btn.active { background:rgba(255,255,255,.15); color:white; font-weight:600 }
.nav-ic { font-size:14px; width:18px; text-align:center; flex-shrink:0 }
.nav-lbl { flex:1 }
.nav-badge { font-size:10px; font-weight:700; padding:1px 7px; border-radius:10px; background:var(--acc2); color:white; flex-shrink:0 }
.sb-footer { padding:12px 8px; border-top:1px solid rgba(255,255,255,.07); position:relative; z-index:1 }
.sb-user { display:flex; align-items:center; gap:9px; padding:9px 11px; background:rgba(255,255,255,.07); border-radius:var(--r2); margin-bottom:7px }
.sb-avatar { width:30px; height:30px; background:var(--acc2); border-radius:50%; display:flex; align-items:center; justify-content:center; font-family:var(--fh); font-size:13px; font-weight:700; color:white; flex-shrink:0 }
.sb-uname { font-size:12px; font-weight:600; color:white }
.sb-urole { font-size:10px; color:rgba(255,255,255,.4) }
.sb-logout { width:100%; padding:7px 11px; background:rgba(255,255,255,.06); border:none; border-radius:var(--r2); color:rgba(255,255,255,.5); font-family:var(--ff); font-size:12px; cursor:pointer; transition:.13s; display:flex; align-items:center; gap:7px }
.sb-logout:hover { background:rgba(200,50,50,.2); color:#ffaaaa }

/* ── TOPBAR ── */
.topbar { background:var(--bg2); border-bottom:1px solid var(--brd); padding:12px 26px; display:flex; align-items:center; justify-content:space-between; position:sticky; top:0; z-index:100; box-shadow:var(--sh) }
.tb-left { display:flex; align-items:center; gap:12px }
.tb-mod { font-family:var(--fh); font-size:15px; font-weight:700; color:var(--acc) }
.tb-chip { font-size:11px; font-weight:700; padding:3px 11px; border-radius:20px; background:#fdeede; color:var(--acc2) }
.tb-ruc { font-size:11px; color:var(--txt3) }
.tb-right { display:flex; align-items:center; gap:9px }
.tb-periodo { background:var(--bg3); border:1.5px solid var(--brd); border-radius:var(--r2); padding:6px 11px; font-family:var(--ff); font-size:12px; color:var(--txt); outline:none; cursor:pointer }
.tb-periodo:focus { border-color:var(--acc) }
.online-dot { width:7px; height:7px; background:#2ecc71; border-radius:50%; animation:pulse 2s infinite }

/* ── PAGE HEADER ── */
.ph { margin-bottom:20px }
.ph-row { display:flex; justify-content:space-between; align-items:flex-start; gap:14px }
.ph h1 { font-family:var(--fh); font-size:22px; font-weight:800; color:var(--acc) }
.ph p { color:var(--txt2); font-size:12.5px; margin-top:3px }

/* ── STATS GRID ── */
.sg { display:grid; grid-template-columns:repeat(auto-fit,minmax(155px,1fr)); gap:11px; margin-bottom:18px }
.sc { background:var(--bg2); border:1px solid var(--brd); border-radius:var(--r); padding:14px 16px; border-left:4px solid var(--ac,var(--acc)); box-shadow:var(--sh); transition:.15s; cursor:default }
.sc:hover { transform:translateY(-2px); box-shadow:var(--sh2) }
.sl { font-size:10px; color:var(--txt2); text-transform:uppercase; letter-spacing:.9px; margin-bottom:4px; font-weight:700 }
.sv { font-size:20px; font-weight:800; color:var(--acc); font-family:var(--fh) }
.sd { font-size:11px; color:var(--txt3); margin-top:2px }

/* ── CARDS ── */
.card { background:var(--bg2); border:1px solid var(--brd); border-radius:var(--r); padding:18px; box-shadow:var(--sh) }
.ch { display:flex; align-items:center; justify-content:space-between; margin-bottom:14px }
.ct { font-family:var(--fh); font-size:13.5px; font-weight:700; color:var(--acc) }

/* ── TABLE ── */
.tw { overflow-x:auto }
table { width:100%; border-collapse:collapse; font-size:12.5px }
thead th { padding:8px 12px; text-align:left; font-size:10px; font-weight:700; color:var(--txt2); text-transform:uppercase; letter-spacing:.8px; border-bottom:2px solid var(--brd); background:var(--bg3); white-space:nowrap }
thead th.r { text-align:right }
tbody tr { border-bottom:1px solid var(--brd); transition:background .1s }
tbody tr:hover { background:var(--bg3) }
tbody td { padding:9px 12px; vertical-align:middle }
tbody tr:last-child { border-bottom:none }
tfoot td { padding:9px 12px; font-weight:700; background:var(--bg3); border-top:2px solid var(--brd2) }
.r { text-align:right }
.mono { font-family:var(--fm) }
.strong { font-weight:700 }

/* ── BADGES ── */
.badge { display:inline-flex; align-items:center; padding:2px 8px; border-radius:20px; font-size:11px; font-weight:700; letter-spacing:.2px }
.bs { background:#d4edda; color:#155724 }
.bd { background:#f8d7da; color:#721c24 }
.bw { background:#fff3cd; color:#856404 }
.bi { background:#d1ecf1; color:#0c5460 }
.bm { background:var(--bg3); color:var(--txt2) }
.bp { background:#e8d5f5; color:#5a2d82 }
.bo { background:#fdeede; color:#855a00 }

/* ── BUTTONS ── */
.btn { display:inline-flex; align-items:center; gap:6px; padding:8px 16px; border-radius:var(--r2); font-family:var(--ff); font-size:12.5px; font-weight:600; cursor:pointer; border:none; transition:.15s; white-space:nowrap; text-decoration:none }
.btn-p { background:var(--acc); color:white }
.btn-p:hover { background:#07192b; transform:translateY(-1px); box-shadow:0 4px 14px rgba(15,45,74,.22) }
.btn-g { background:transparent; color:var(--txt2); border:1.5px solid var(--brd2) }
.btn-g:hover { background:var(--bg3); color:var(--txt); border-color:var(--acc) }
.btn-gold { background:var(--acc2); color:white }
.btn-gold:hover { background:#a86820 }
.btn-green { background:var(--acc3); color:white }
.btn-green:hover { background:#164d2e }
.btn-d { background:#fff0f0; color:var(--acc4); border:1px solid #ffd0d0 }
.btn-d:hover { background:#ffe4e4 }
.btn-teal { background:var(--acc6); color:white }
.btn-teal:hover { background:#084f68 }
.btn-s { padding:5px 11px; font-size:12px }
.btn:disabled { opacity:.4; cursor:not-allowed; transform:none !important }

/* ── FORMS ── */
.fg { margin-bottom:12px }
.fl { display:block; font-size:10.5px; font-weight:700; color:var(--txt2); margin-bottom:4px; text-transform:uppercase; letter-spacing:.5px }
.fi, .fsel, .fta { width:100%; background:var(--bg); border:1.5px solid var(--brd); border-radius:var(--r2); padding:8px 12px; color:var(--txt); font-family:var(--ff); font-size:13px; outline:none; transition:.15s }
.fi:focus, .fsel:focus, .fta:focus { border-color:var(--acc); box-shadow:0 0 0 3px rgba(15,45,74,.07) }
.fi[readonly] { background:var(--bg3); color:var(--txt2) }
.fsel option { background:white }
.fta { resize:vertical; min-height:60px }
.fg2 { display:grid; grid-template-columns:1fr 1fr; gap:11px }
.fg3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:11px }
.fg4 { display:grid; grid-template-columns:repeat(4,1fr); gap:11px }
.span2 { grid-column:span 2 }
.span3 { grid-column:span 3 }

/* ── MODAL ── */
.overlay { position:fixed; inset:0; background:rgba(0,0,0,.5); backdrop-filter:blur(4px); display:flex; align-items:center; justify-content:center; z-index:1000; animation:fIn .15s ease }
@keyframes fIn { from{opacity:0} to{opacity:1} }
.modal { background:white; border-radius:14px; padding:26px; width:90%; max-width:560px; max-height:92vh; overflow-y:auto; animation:sUp .2s cubic-bezier(.34,1.56,.64,1); box-shadow:var(--sh3) }
.modal-lg { max-width:820px }
.modal-xl { max-width:1080px }
@keyframes sUp { from{opacity:0;transform:translateY(12px) scale(.97)} to{opacity:1;transform:none} }
.mh { display:flex; align-items:center; justify-content:space-between; margin-bottom:18px; padding-bottom:14px; border-bottom:2px solid var(--brd) }
.mt { font-family:var(--fh); font-size:17px; font-weight:800; color:var(--acc) }
.mf { display:flex; justify-content:flex-end; gap:9px; margin-top:18px; padding-top:15px; border-top:1px solid var(--brd) }

/* ── TOOLBAR ── */
.toolbar { display:flex; align-items:center; gap:9px; margin-bottom:13px; flex-wrap:wrap }
.si { position:relative; min-width:150px; max-width:260px; flex:1 }
.sic { position:absolute; left:10px; top:50%; transform:translateY(-50%); color:var(--txt3); font-size:13px; pointer-events:none }
.sin { width:100%; background:var(--bg); border:1.5px solid var(--brd); border-radius:var(--r2); padding:8px 12px 8px 32px; color:var(--txt); font-family:var(--ff); font-size:13px; outline:none; transition:.15s }
.sin:focus { border-color:var(--acc) }

/* ── TABS ── */
.tabs { display:flex; gap:0; margin-bottom:16px; border-bottom:2px solid var(--brd); overflow-x:auto }
.tab { padding:8px 16px; border:none; background:transparent; font-family:var(--ff); font-size:12.5px; font-weight:600; color:var(--txt2); cursor:pointer; transition:.13s; border-bottom:2px solid transparent; margin-bottom:-2px; white-space:nowrap; flex-shrink:0 }
.tab:hover { color:var(--acc) }
.tab.active { color:var(--acc); border-bottom-color:var(--acc) }

/* ── GRIDS ── */
.g2 { display:grid; grid-template-columns:1fr 1fr; gap:16px }
.g3 { display:grid; grid-template-columns:repeat(3,1fr); gap:14px }
.g4 { display:grid; grid-template-columns:repeat(4,1fr); gap:12px }

/* ── EMPTY ── */
.empty { text-align:center; padding:44px 20px; color:var(--txt3) }
.empty .ei { font-size:44px; margin-bottom:9px }

/* ── NOTIF ── */
.notifs { position:fixed; top:18px; right:18px; z-index:9999; display:flex; flex-direction:column; gap:7px; pointer-events:none }
.notif { background:white; border:1px solid var(--brd); border-radius:var(--r); padding:11px 16px; font-size:13px; display:flex; align-items:center; gap:9px; box-shadow:var(--sh2); animation:sUp .18s ease; min-width:240px; font-weight:500; pointer-events:auto }
.notif.ok { border-left:4px solid var(--acc3) }
.notif.err { border-left:4px solid var(--acc4) }
.notif.info { border-left:4px solid var(--acc) }

/* ── CLIENTE CARD ── */
.cli-card { background:var(--bg2); border:1.5px solid var(--brd); border-radius:var(--r); padding:17px; cursor:pointer; transition:.17s; position:relative; overflow:hidden }
.cli-card::before { content:''; position:absolute; top:0; left:0; width:4px; height:100%; background:var(--rc, var(--acc)) }
.cli-card:hover { border-color:var(--acc); box-shadow:var(--sh2); transform:translateY(-2px) }
.cc-name { font-family:var(--fh); font-size:13.5px; font-weight:700; color:var(--acc) }
.cc-ruc { font-size:11.5px; color:var(--txt3); font-family:var(--fm); margin-top:2px }
.cc-body { display:flex; flex-direction:column; gap:4px; margin:10px 0 }
.cc-row { display:flex; align-items:center; gap:6px; font-size:12px; color:var(--txt2) }
.cc-ft { display:flex; align-items:center; justify-content:space-between; padding-top:10px; border-top:1px solid var(--brd); margin-top:2px }

/* ── ASIENTO PREVIEW ── */
.ap-box { background:var(--bg3); border-radius:var(--r2); padding:14px; margin-top:12px; border:1px solid var(--brd) }
.ap-hdr { font-size:10px; font-weight:700; color:var(--txt2); text-transform:uppercase; letter-spacing:.9px; margin-bottom:9px }
.ap-row { display:flex; align-items:center; gap:8px; padding:5px 0; border-bottom:1px solid var(--brd); font-size:12px }

.ap-H { width:95px; text-align:right; font-family:var(--fm); color:var(--acc4); font-weight:600 }
.ap-tot { display:flex; justify-content:space-between; margin-top:8px; padding-top:7px; border-top:2px solid var(--brd2); font-weight:800; font-family:var(--fm); font-size:12.5px }

/* ── ASIENTO CARD ── */
.asiento-card { background:var(--bg2); border:1px solid var(--brd); border-radius:var(--r); margin-bottom:10px; overflow:hidden; transition:.15s }
.asiento-card:hover { border-color:var(--acc); box-shadow:var(--sh) }
.as-hdr { padding:11px 16px; background:var(--bg3); display:flex; align-items:center; gap:10px; cursor:pointer; user-select:none }
.as-num { font-family:var(--fm); font-size:11px; font-weight:700; color:var(--acc); background:rgba(15,45,74,.1); padding:2px 9px; border-radius:20px; flex-shrink:0 }

.as-fecha { font-size:11px; color:var(--txt2); font-family:var(--fm); flex-shrink:0 }

function calcTrab(t) {
  const s=t.remuneracion, afp=AFP_RATES[t.afp]||AFP_RATES.Prima, isMype=t.regLaboral==='mype';
  const essalud=s*ESSALUD, descTrab=s*(afp.ap+afp.seg+afp.com), neto=s-descTrab;
  const cts=isMype?(s*0.5/12):(s+essalud)/12;
  const vac=isMype?(s*0.5/12):(s/12);
  const grati=isMype?0:(s/6);
  const bonifExtra=isMype?0:(grati*0.09);
  return { s, essalud, descTrab, neto, cts, vac, grati, bonifExtra, costo:s+essalud+cts+vac+grati+bonifExtra, isMype };
}
function calcPlanillaTotal() {
  return getData('trabajadores').reduce((a,t)=>{ const c=calcTrab(t); return {sueldos:a.sueldos+c.s,essalud:a.essalud+c.essalud,cts:a.cts+c.cts,vac:a.vac+c.vac,grati:a.grati+c.grati,bonif:a.bonif+c.bonifExtra,costo:a.costo+c.costo,desc:a.desc+c.descTrab}; },{sueldos:0,essalud:0,cts:0,vac:0,grati:0,bonif:0,costo:0,desc:0});
}
function calcDepAct(a) {
  const m=a.valor/a.vida/12, acum=a.acum+m, neto=a.valor-acum, meses=Math.max(0,a.vida*12-Math.round(a.acum/m)||0);
  return { m, anual:a.valor/a.vida, acum, neto, meses };
}
function calcImpuestos() {
  const vs=getData('ventas'), cs=getData('compras');
  const bV=vs.reduce((s,v)=>s+v.base,0), igvV=vs.reduce((s,v)=>s+v.igv,0);
  const igvC=cs.filter(c=>c.credito).reduce((s,c)=>s+c.igv,0);
  const igvP=Math.max(0,igvV-igvC);
  const cl=ST.clientes.find(c=>c.id===ST.clienteActivo)||{};
  const coef=cl.regimen==='RG'?0.015:cl.regimen==='RMT'?0.01:0;
  const pagoCta=bV*coef;
  return {bV,igvV,igvC,igvP,coef,pagoCta,total:igvP+pagoCta};
}

async function fbGetAll(col) {

function navTo(mod, btn) {
  ST.currentMod=mod;
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  if(btn) btn.classList.add('active');
  renderModule(mod);
}

function cambiarCliente(id) {
  ST.clienteActivo=id;
  const c=ST.clientes.find(x=>x.id===id);
  const chip=$('tb-chip'), ruc=$('tb-ruc');
  if(chip) chip.textContent=c?.razonSocial||'—';
  if(ruc) ruc.textContent='RUC: '+(c?.ruc||'—');
  renderModule(ST.currentMod);
}

function renderModule(mod) {
  const modTitles={dashboard:'Dashboard',clientes:'Clientes',declaraciones:'Declaraciones SUNAT',calendario:'Calendario Tributario',diario:'Libro Diario',mayor:'Libro Mayor',balance:'Balance de Comprobación',ventas:'Registro de Ventas',compras:'Registro de Compras',pdt621:'PDT 621',planilla:'Planilla y Beneficios',depreciacion:'Depreciación de Activos',incobrables:'Cobranza Dudosa',documentos:'Documentos PDF',cuentas:'Plan de Cuentas PCGE'};
  const el=$('tb-mod'); if(el) el.textContent=modTitles[mod]||mod;
  const fns={dashboard:renderDashboard,clientes:renderClientes,declaraciones:renderDeclaraciones,calendario:renderCalendario,diario:renderDiario,mayor:renderMayor,balance:renderBalance,ventas:renderVentas,compras:renderCompras,pdt621:renderPDT621,planilla:renderPlanilla,depreciacion:renderDepreciacion,incobrables:renderIncobrables,documentos:renderDocumentos,cuentas:renderCuentas};
  const mc=$('main');
  if(mc) mc.innerHTML=`<div class="module">${(!ST.fbOk?renderFBBanner():'')}${(fns[mod]||renderDashboard)()}</div>`;
}

async function saveCliente(editId) {
  const rs=$('cc-rs')?.value.trim(), ruc=$('cc-ruc')?.value.trim();
  if(!rs||!ruc){notify('Razón social y RUC son requeridos','err');return;}
  const obj={razonSocial:rs,ruc,regimen:$('cc-reg').value,responsable:$('cc-resp').value,email:$('cc-email').value,telefono:$('cc-tel').value,periodoInicio:$('cc-ini').value,direccion:$('cc-dir').value,notas:$('cc-not').value,activo:true};
  if(editId){
    await fbUpdate('clientes',editId,obj);
    const idx=ST.clientes.findIndex(c=>c.id===editId);
    if(idx>=0) ST.clientes[idx]={...ST.clientes[idx],...obj};
    notify('Cliente actualizado ✓');
  } else {
    const id=await fbSave('clientes',obj)||('c_'+Date.now());
    ST.clientes.unshift({id,...obj});
    if(!ST._data[id]) ST._data[id]={trabajadores:[],ventas:[],compras:[],activos:[],incobrables:[],asientos:[],declaraciones:[]};
    notify('Cliente registrado ✓');
  }
  closeModal(); renderApp();
}

function verCliente(id) {
  ST.clienteActivo=id;
  const sel=$('cli-sel'); if(sel) sel.value=id;
  navTo('declaraciones');
}

async function saveDecl(editId) {

    <div class="sc" style="--ac:var(--acc3)"><div class="sl">TOTAL DEBE</div><div class="sv" style="font-size:15px;color:var(--acc3)">${S(tD)}</div></div>
    <div class="sc" style="--ac:var(--acc4)"><div class="sl">TOTAL HABER</div><div class="sv" style="font-size:15px;color:var(--acc4)">${S(tH)}</div></div>
    <div class="sc" style="--ac:${cuadra?'var(--acc3)':'var(--acc4)'}"><div class="sl">PARTIDA</div><div class="sv" style="font-size:16px;color:${cuadra?'var(--acc3)':'var(--acc4)'}">${cuadra?'✓ OK':'✕ Error'}</div></div>

function toggleAs(id){const b=$(id),ic=$('ic-'+id);if(!b)return;const o=b.classList.toggle('open');if(ic)ic.textContent=o?'▲':'▼';}
function delAsiento(id){if(!confirm('¿Eliminar asiento?'))return;setData('asientos',getData('asientos').filter(a=>a.id!==id));notify('Eliminado');renderModule('diario');}
function editAsiento(id){openAsientoModal(getData('asientos').find(a=>a.id===id));}

const PCGE_SEL=[['101','Caja'],['104','Cuentas corrientes'],['121','Fact. por cobrar'],['401','Tributos por pagar'],['4011','IGV cta. propia'],['4017','IR por pagar'],['411','Remuneraciones por pagar'],['415','Beneficios sociales'],['421','Fact. por pagar'],['501','Capital social'],['591','Resultados acumulados'],['601','Mercaderías'],['621','Remuneraciones'],['625','CTS'],['627','ESSALUD'],['632','Asesoría y consultoría'],['636','Servicios básicos'],['641','Gastos tributarios'],['681','Depreciación'],['684','Estimación cob. dudosa'],['191','Prov. cob. dudosa'],['393','Depreciación acumulada'],['701','Ventas mercaderías'],['704','Ventas servicios'],['94','Gastos administración'],['95','Gastos ventas']];

function openAsientoModal(data=null) {
  asPartidas=data?JSON.parse(JSON.stringify(data.partidas)):[{cta:'',nom:'',D:0,H:0},{cta:'',nom:'',D:0,H:0}];
  const d=data||{fecha:today(),numero:'',glosa:''};
  const cuentasOpts=PCGE_SEL.map(([k,v])=>`<option value="${k}">${k} — ${v}</option>`).join('');
  $('modal-root').innerHTML=`<div class="overlay" onclick="if(event.target===this)closeModal()">
  <div class="modal modal-xl"><div class="mh"><span class="mt">${data?'Editar':'Nuevo'} Asiento</span><button class="btn btn-g btn-s" onclick="closeModal()">✕</button></div>
  <div class="fg3" style="margin-bottom:12px">
    <div class="fg"><label class="fl">N° Asiento</label><input class="fi" id="as-num" value="${esc(d.numero)}" placeholder="001"/></div>
    <div class="fg"><label class="fl">Fecha</label><input class="fi" id="as-fecha" type="date" value="${d.fecha}"/></div>
    <div class="fg span3"><label class="fl">Glosa *</label><input class="fi" id="as-glosa" value="${esc(d.glosa)}" placeholder="Descripción del asiento"/></div>
  </div>

  <table class="as-table" style="margin-bottom:10px"><thead><tr><th style="width:200px">Cuenta</th><th>Descripción</th><th class="r" style="width:120px">DEBE</th><th class="r" style="width:120px">HABER</th><th style="width:36px"></th></tr></thead>
  <tbody id="as-partidas"></tbody>
  <tfoot><tr><td colspan="2" style="text-align:right">TOTALES</td><td class="r as-D" id="as-tD">S/ 0.00</td><td class="r as-H" id="as-tH">S/ 0.00</td><td></td></tr></tfoot></table>
  <button class="btn btn-g btn-s" onclick="asAddPartida()">+ Línea</button>
  <div id="as-err" style="display:none;color:var(--acc4);font-size:12px;font-weight:600;margin-top:7px">⚠ El asiento no cuadra</div>
  <div class="mf"><button class="btn btn-g" onclick="closeModal()">Cancelar</button><button class="btn btn-p" onclick="asGuardar(${data?`'${data.id}'`:'null'})">${data?'Guardar':'Registrar'}</button></div>
  </div></div>`;
  asRenderPartidas(cuentasOpts);
}

function asRenderPartidas(opts) {
  const co=opts||PCGE_SEL.map(([k,v])=>`<option value="${k}">${k} — ${v}</option>`).join('');
  const tb=$('as-partidas'); if(!tb) return;
  tb.innerHTML=asPartidas.map((p,i)=>`<tr>
    <td><select class="fsel" style="font-size:12px;padding:5px 8px" onchange="asUpdP(${i},'cta',this.value)"><option value="">-- Cuenta --</option>${co.replace(`value="${p.cta}"`,`value="${p.cta}" selected`)}</select></td>
    <td style="font-size:12px;color:var(--txt2)">${PCGE_SEL.find(([k])=>k===p.cta)?.[1]||''}</td>
    <td><input type="number" class="fi" style="text-align:right;padding:5px 8px;font-size:12px" value="${p.D||''}" oninput="asUpdP(${i},'D',this.value)"/></td>
    <td><input type="number" class="fi" style="text-align:right;padding:5px 8px;font-size:12px" value="${p.H||''}" oninput="asUpdP(${i},'H',this.value)"/></td>
    <td><button class="btn btn-s btn-d" style="padding:4px 7px" onclick="asRemP(${i})">✕</button></td>
  </tr>`).join('');
  asUpdTots();
}
function asUpdP(i,f,v){asPartidas[i][f]=f==='cta'?v:parseFloat(v)||0;if(f==='cta')asRenderPartidas();else asUpdTots();}
function asAddPartida(){asPartidas.push({cta:'',nom:'',D:0,H:0});asRenderPartidas();}
function asRemP(i){asPartidas.splice(i,1);asRenderPartidas();}
function asUpdTots(){const tD=$('as-tD'),tH=$('as-tH'),err=$('as-err');const D=asPartidas.reduce((s,p)=>s+p.D,0),H=asPartidas.reduce((s,p)=>s+p.H,0);if(tD)tD.textContent=S(D);if(tH)tH.textContent=S(H);if(err)err.style.display=Math.abs(D-H)<0.01||D===0?'none':'block';}
function asGuardar(editId){
  const glosa=$('as-glosa')?.value.trim(),fecha=$('as-fecha')?.value;
  if(!glosa||!fecha){notify('Completa fecha y glosa','err');return;}
  const D=asPartidas.reduce((s,p)=>s+p.D,0),H=asPartidas.reduce((s,p)=>s+p.H,0);
  if(Math.abs(D-H)>0.01){notify('El asiento no cuadra','err');return;}
  const obj={fecha,numero:$('as-num').value,glosa,partidas:asPartidas.map(p=>({...p,nom:PCGE_SEL.find(([k])=>k===p.cta)?.[1]||p.nom}))};
  const arr=getData('asientos');
  if(editId){const idx=arr.findIndex(a=>a.id===editId);if(idx>=0)arr[idx]={...arr[idx],...obj};notify('Asiento actualizado ✓');}
  else{arr.unshift({id:'A'+Date.now(),...obj});notify('Asiento registrado ✓');}
  closeModal();renderModule('diario');
}
function genAsientosAuto(){
  const arr=getData('asientos');
  getData('ventas').forEach((v,i)=>arr.push({id:'AV'+Date.now()+i,fecha:v.fecha,numero:String(arr.length+1).padStart(3,'0'),glosa:`VENTA: ${v.cliente} - ${v.serie}-${v.numero}`,partidas:[{cta:'121',nom:'Fact. por cobrar',D:v.total,H:0},{cta:'704',nom:'Ventas servicios',D:0,H:v.base},{cta:'4011',nom:'IGV cta. propia',D:0,H:v.igv}]}));
  getData('compras').forEach((c,i)=>arr.push({id:'AC'+Date.now()+i,fecha:c.fecha,numero:String(arr.length+1).padStart(3,'0'),glosa:`COMPRA: ${c.proveedor} - ${c.serie}-${c.numero}`,partidas:[{cta:'636',nom:'Servicios / Gastos',D:c.base,H:0},{cta:'4011',nom:'IGV crédito fiscal',D:c.igv,H:0},{cta:'421',nom:'Fact. por pagar',D:0,H:c.total}]}));
  notify(`${getData('ventas').length+getData('compras').length} asientos generados ✓`);renderModule('diario');
}

function renderMayor() {
  const cl=ST.clientes.find(c=>c.id===ST.clienteActivo)||{};
  const ctas={};
  getData('asientos').forEach(a=>a.partidas.forEach(p=>{
    if(!p.cta) return;
    if(!ctas[p.cta]) ctas[p.cta]={D:0,H:0,movs:[]};
    ctas[p.cta].D+=p.D; ctas[p.cta].H+=p.H;
    ctas[p.cta].movs.push({fecha:a.fecha,glosa:a.glosa,D:p.D,H:p.H});
  }));
  const cards=Object.entries(ctas).sort((a,b)=>a[0].localeCompare(b[0])).map(([cta,d])=>{
    const nom=PCGE_SEL.find(([k])=>k===cta)?.[1]||cta;
    const saldo=d.D-d.H;
    let sa=0;
    const filas=d.movs.map(m=>{sa+=m.D-m.H;return `<tr><td style="font-size:11px;color:var(--txt2)">${m.fecha}</td><td style="font-size:12px">${esc(m.glosa)}</td><td class="r mono" style="color:var(--acc3)">${m.D>0?S(m.D):'—'}</td><td class="r mono" style="color:var(--acc4)">${m.H>0?S(m.H):'—'}</td><td class="r mono" style="font-weight:600;color:${sa>=0?'var(--acc3)':'var(--acc4)'}">${S(Math.abs(sa))}</td></tr>`;}).join('');
    return `<div class="card" style="margin-bottom:12px">
      <div style="background:var(--acc);color:white;margin:-18px -18px 12px;padding:12px 18px;display:flex;align-items:center;gap:12px;border-radius:var(--r) var(--r) 0 0">
        <span style="font-family:var(--fm);font-size:13px;font-weight:700">${cta}</span>
        <span style="flex:1;font-weight:600">${nom}</span>
        <span style="font-family:var(--fm);font-size:13px">${saldo>=0?S(saldo)+' DEUDOR':S(Math.abs(saldo))+' ACREEDOR'}</span>
      </div>
      <div class="tw"><table><thead><tr><th>Fecha</th><th>Concepto</th><th class="r" style="color:var(--acc3)">DEBE</th><th class="r" style="color:var(--acc4)">HABER</th><th class="r">SALDO</th></tr></thead><tbody>${filas}</tbody>
      <tfoot><tr><td colspan="2" style="text-align:right">TOTALES</td><td class="r mono" style="color:var(--acc3)">${S(d.D)}</td><td class="r mono" style="color:var(--acc4)">${S(d.H)}</td><td class="r mono">${S(Math.abs(saldo))}</td></tr></tfoot></table></div></div>`;
  }).join('');

  return `<div class="ph"><h1>📒 Libro Mayor</h1><p>${esc(cl.razonSocial||'—')} · ${ST.periodoActivo} · ${Object.keys(ctas).length} cuentas</p></div>
  ${Object.keys(ctas).length?cards:'<div class="empty"><div class="ei">📒</div><p>Sin movimientos. Registra asientos en el Libro Diario.</p></div>'}`;
}

function renderBalance() {
  const cl=ST.clientes.find(c=>c.id===ST.clienteActivo)||{};
  const ctas={};
  getData('asientos').forEach(a=>a.partidas.forEach(p=>{if(!p.cta)return;if(!ctas[p.cta])ctas[p.cta]={D:0,H:0};ctas[p.cta].D+=p.D;ctas[p.cta].H+=p.H;}));
  let tD=0,tH=0,tSD=0,tSH=0;
  const rows=Object.entries(ctas).sort((a,b)=>a[0].localeCompare(b[0])).map(([c,d])=>{
    const s=d.D-d.H,sD=s>=0?s:0,sH=s<0?Math.abs(s):0;
    tD+=d.D;tH+=d.H;tSD+=sD;tSH+=sH;
    return `<tr><td style="font-family:var(--fm);font-size:11px;font-weight:700;color:var(--acc)">${c}</td><td>${PCGE_SEL.find(([k])=>k===c)?.[1]||c}</td><td class="r mono" style="color:var(--acc3)">${S(d.D)}</td><td class="r mono" style="color:var(--acc4)">${S(d.H)}</td><td class="r mono" style="color:var(--acc3)">${sD>0?S(sD):'—'}</td><td class="r mono" style="color:var(--acc4)">${sH>0?S(sH):'—'}</td></tr>`;
  }).join('');
  const ok=Math.abs(tD-tH)<0.01;

  return `<div class="ph"><div class="ph-row"><div><h1>⚖ Balance de Comprobación</h1><p>${esc(cl.razonSocial||'—')} · ${ST.periodoActivo}</p></div>
  <span class="badge ${ok?'bs':'bd'}" style="font-size:13px;padding:6px 16px">${ok?'✓ CUADRA':'✕ NO CUADRA'}</span></div></div>
  <div class="card"><div class="tw"><table>
    <thead><tr><th>Cuenta</th><th>Nombre</th><th class="r" style="color:var(--acc3)">DEBE</th><th class="r" style="color:var(--acc4)">HABER</th><th class="r" style="color:var(--acc3)">SALDO DEUDOR</th><th class="r" style="color:var(--acc4)">SALDO ACREEDOR</th></tr></thead>
    <tbody>${rows||'<tr><td colspan="6"><div class="empty"><div class="ei">⚖</div><p>Sin movimientos</p></div></td></tr>'}</tbody>
    <tfoot><tr style="background:var(--acc);color:white"><td colspan="2" style="padding:10px 12px;text-align:right;font-weight:800">TOTALES</td><td class="r mono" style="padding:10px 12px">${S(tD)}</td><td class="r mono" style="padding:10px 12px">${S(tH)}</td><td class="r mono" style="padding:10px 12px">${S(tSD)}</td><td class="r mono" style="padding:10px 12px">${S(tSH)}</td></tr></tfoot>
  </table></div></div>`;
}

function renderPlanTab(){
  const trabs=getData('trabajadores');
  if(planTab==='asiento') return renderAPBox(buildAsientoPlanilla(),'Asiento de Provisión de Planilla — '+ST.periodoActivo);
  const cols={mensual:['Nombre / AFP','Sueldo','ESSALUD','Desc.Trab.','Neto','CTS','Vacac.','Gratis.','Costo'],cts:['Nombre','Sueldo','ESSALUD','CTS Mensual','Depósito Sem.','Total Anual'],vacaciones:['Nombre','Sueldo','Vacac. Mensual','Total Anual','Pago Vacacional'],gratificaciones:['Nombre','Sueldo','Prov. Gratis.','Bonif.9%','Total Mensual','Anual (x2)']};
  const rows=trabs.map(t=>{
    const c=calcTrab(t);
    if(planTab==='mensual') return `<tr><td><div style="font-weight:600">${esc(t.nombre)}</div><div style="font-size:11px;color:var(--txt2)">${esc(t.cargo)} · ${t.afp}${t.regLaboral==='mype'?' · <span class="badge bp" style="font-size:10px">MYPE</span>':''}</div></td><td class="r mono">${S(c.s)}</td><td class="r mono">${S(c.essalud)}</td><td class="r mono" style="color:var(--acc4)">${S(c.descTrab)}</td><td class="r mono" style="color:var(--acc3);font-weight:700">${S(c.neto)}</td><td class="r mono">${S(c.cts)}</td><td class="r mono">${S(c.vac)}</td><td class="r mono">${S(c.grati)}</td><td class="r mono strong">${S(c.costo)}</td></tr>`;
    if(planTab==='cts') return `<tr><td><div style="font-weight:600">${esc(t.nombre)}</div></td><td class="r mono">${S(c.s)}</td><td class="r mono">${S(c.essalud)}</td><td class="r mono" style="color:var(--acc2);font-weight:700">${S(c.cts)}</td><td class="r mono">${S(c.cts*6)}</td><td class="r mono">${S(c.cts*12)}</td></tr>`;
    if(planTab==='vacaciones') return `<tr><td><div style="font-weight:600">${esc(t.nombre)}</div><div style="font-size:11px;color:var(--txt2)">${t.regLaboral==='mype'?'15 días':'30 días'}</div></td><td class="r mono">${S(c.s)}</td><td class="r mono" style="color:var(--acc5);font-weight:700">${S(c.vac)}</td><td class="r mono">${S(c.vac*12)}</td><td class="r mono">${S(c.s/(t.regLaboral==='mype'?2:1))}</td></tr>`;

    return '';

  const wb=XLSX.utils.book_new();
  // Diario
  const rD=[['N°','Fecha','Glosa','Cuenta','Descripción','Debe','Haber']];
  getData('asientos').forEach(a=>a.partidas.forEach(p=>rD.push([a.numero,a.fecha,a.glosa,p.cta,p.nom||'',p.D,p.H])));
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(rD),'Libro Diario');
  // Ventas
  const rV=[['Fecha','Tipo','Serie','Número','RUC','Cliente','Base','IGV','Total']];
  getData('ventas').forEach(v=>rV.push([v.fecha,v.tipoDoc,v.serie,v.numero,v.rucCli,v.cliente,v.base,v.igv,v.total]));
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(rV),'Reg. Ventas');
  // Compras
  const rC=[['Fecha','Serie','Número','RUC Prov.','Proveedor','Base','IGV','Total','Crédito']];
  getData('compras').forEach(c=>rC.push([c.fecha,c.serie,c.numero,c.rucProv,c.proveedor,c.base,c.igv,c.total,c.credito?'Sí':'No']));
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(rC),'Reg. Compras');
  // Planilla
  const p=calcPlanillaTotal();
  const rP=[['Trabajador','Cargo','AFP','Sueldo','ESSALUD','Desc.Trab.','Neto','CTS','Vacac.','Gratis.','Costo']];
  getData('trabajadores').forEach(t=>{const c=calcTrab(t);rP.push([t.nombre,t.cargo,t.afp,c.s,c.essalud,c.descTrab,c.neto,c.cts,c.vac,c.grati,c.costo])});
  rP.push(['TOTALES','','',p.sueldos,p.essalud,p.desc,p.sueldos-p.desc,p.cts,p.vac,p.grati,p.costo]);
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(rP),'Planilla');
  // Depreciación
  const rAc=[['Activo','Categoría','Valor','Vida útil','Dep.Mensual','Dep.Anual','Dep.Acum.','Valor Neto']];
  getData('activos').forEach(a=>{const d=calcDepAct(a);rAc.push([a.desc,a.cat,a.valor,a.vida,d.m,d.anual,d.acum,d.neto])});
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(rAc),'Depreciación');
  // PDT 621
  const i=calcImpuestos();
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([['PDT 621 — '+cl.razonSocial],['RUC',cl.ruc],['Período',ST.periodoActivo],[],['Campo','Casilla','Valor'],['Base ventas','100',i.bV],['IGV débito','101',i.igvV],['IGV crédito','108',i.igvC],['IGV a pagar','109',i.igvP],['Pago cta. IR','303',i.pagoCta],['TOTAL','—',i.total]]),'PDT 621');
  XLSX.writeFile(wb,`ContaGestion_${cl.razonSocial}_${ST.periodoActivo}.xlsx`);
  notify('Exportación completa: 6 hojas Excel ✓');
}

function openFBConfig(){
  $('modal-root').innerHTML=`<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="mh"><span class="mt">⚙ Configurar Firebase</span><button class="btn btn-g btn-s" onclick="closeModal()">✕</button></div>
  <p style="font-size:13px;color:var(--txt2);margin-bottom:14px">Ve a <strong>console.firebase.google.com</strong> → Tu proyecto → ⚙ Configuración → Aplicaciones web → Copiar configuración.</p>
  ${['apiKey:API Key','authDomain:Auth Domain','projectId:Project ID','storageBucket:Storage Bucket','appId:App ID'].map(f=>{const[id,lbl]=f.split(':');return `<div class="fg"><label class="fl">${lbl}</label><input class="fi" id="fb-${id}" placeholder="${id}..."/></div>`;}).join('')}
  <div style="background:#e8f5ee;border-radius:var(--r2);padding:11px 14px;font-size:12px;color:#155724;margin-top:6px">✅ Una vez configurado, todos los datos se guardan automáticamente en Firebase Firestore.</div>
  <div class="mf"><button class="btn btn-g" onclick="closeModal()">Cancelar</button><button class="btn btn-p" onclick="saveFBConfig()">Guardar y reconectar</button></div></div></div>`;
}
function saveFBConfig(){
  const cfg={apiKey:$('fb-apiKey')?.value.trim(),authDomain:$('fb-authDomain')?.value.trim(),projectId:$('fb-projectId')?.value.trim(),storageBucket:$('fb-storageBucket')?.value.trim(),appId:$('fb-appId')?.value.trim()};
  if(!cfg.apiKey||!cfg.projectId){notify('API Key y Project ID son requeridos','err');return;}
  localStorage.setItem('cgp_fbconfig',JSON.stringify(cfg));
  notify('Configuración guardada. Recarga la página para activar Firebase.','info');
  closeModal();
}
